[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "singleaxis-fabric"
description = "Customer-controlled OpenTelemetry capture SDK for reconstructing AI agent activity."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "AI5Labs Research OPC Private Limited", email = "fabric@singleaxis.ai" }]
keywords = ["singleaxis", "fabric", "llm", "agent", "observability", "otel", "tracing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.41",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
# Wire-capture node mode (spec 048) needs no extra entry: this exporter
# already depends on `requests` and `opentelemetry-proto`, which the content
# client uses. boto3 is never a wire-capture dependency (the Node writes S3).
otlp = [
  "opentelemetry-exporter-otlp-proto-http>=1.41",
  "urllib3>=2.8.0",
  # Spec 049 §7.8: node mode (the production profile) seals the agent spool with an
  # AES-256-GCM customer-key envelope.
  "cryptography>=49",
]
# Reader side only: `python -m fabric.reconstruct --store-uri s3://...` and
# S3ContentStore read the customer's bucket with boto3. Never needed by an
# agent (the Node writes S3) and never imported by the capture path.
s3 = [
  "boto3>=1.34",
]
# Optional MCP (Model Context Protocol) tool-call instrumentation. The
# `fabric.integrations.mcp` module duck-types the client session via a
# local Protocol, so it imports without this extra; the extra only
# pulls the real `mcp` package in for users wiring it to a live server.
mcp = [
  "mcp>=1.0",
  "PyJWT>=2.15.0",
]
# Optional generic signature verification (spec 023 §4). The
# `fabric.verify_signature` ed25519 path uses `cryptography` when present
# and otherwise degrades to verified=False; hmac-sha256 is stdlib-only and
# needs nothing here. This extra pulls the real primitive in for users who
# want ed25519 verification.
signing = [
  "cryptography>=49",
]
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "jsonschema>=4.23",
  "types-jsonschema>=4.23",
  "PyYAML>=6.0.2,<7.0",
  "types-PyYAML>=6.0.12",
  "httpx>=0.27",
  # Real provider SDKs qualify wire capture end to end (spec 047 §2):
  # openai>=3 and anthropic>=1 send through httpx2. Dev-only; capture never
  # depends on them at runtime.
  "openai>=3.26.1",
  "anthropic>=1.12.1",
  "opentelemetry-exporter-otlp-proto-http>=1.41",
  "urllib3>=2.8.0",
  # cryptography exercises the real ed25519 path in the generic
  # signature-verification tests (spec 023); without it ed25519 degrades
  # to verified=False and those asserts are skipped.
  "cryptography>=49",
  # Drives the aiohttp capture point tests. Dev-only: capture patches aiohttp
  # only when the application already imports it.
  "aiohttp>=3.9",
]

[project.urls]
Homepage      = "https://github.com/singleaxis/singleaxis-fabric"
Repository    = "https://github.com/singleaxis/singleaxis-fabric"
Documentation = "https://github.com/singleaxis/singleaxis-fabric/blob/main/specs/027-recorder-v1.md"
Issues        = "https://github.com/singleaxis/singleaxis-fabric/issues"

[tool.hatch.version]
# VERSION is the repository authority; this checked-in mirror lets wheels,
# sdists, editable installs, and source checkouts report the same identity.
# scripts/verify_release_identity.py rejects a tag or build when they diverge.
path = "src/fabric/_version.py"

[tool.hatch.build.targets.sdist]
# Release sdists are production source artifacts, not test-fixture bundles.
# Conformance goldens are authoritative at the repository-level contracts/
# path and intentionally do not ship as a stale duplicate under tests/.
include = ["/src", "/README.md", "/LICENSE"]
exclude = [
  "/tests",
  "**/.gitignore",
  "/src/fabric/cli.py",
  "/src/fabric/deployment.py",
  "/src/fabric/_chain.py",
  "/src/fabric/_uds.py",
  "/src/fabric/escalation.py",
  "/src/fabric/eval.py",
  "/src/fabric/guardrails.py",
  "/src/fabric/judge.py",
  "/src/fabric/nemo.py",
  "/src/fabric/policy.py",
  "/src/fabric/presidio.py",
  "/src/fabric/stream.py",
  "/src/fabric/tool_auth.py",
  "/src/fabric/auto_instrument.py",
  "/src/fabric/coverage_manifest.py",
  "/src/fabric/_coverage_canary.py",
  "/src/fabric/_instrumentation_registry.py",
  "/src/fabric/distributed_closure.py",
  "/src/fabric/reference_receipts.py",
  "/src/fabric/control_protocol.py",
  "/src/fabric/deployment_state.py",
  "/src/fabric/capture_identity.py",
  "/src/fabric/capture_readback.py",
  "/src/fabric/enterprise.py",
  "/src/fabric/enterprise_preflight.py",
  "/src/fabric/capture_capabilities.py",
  "/src/fabric/adapters/agent_framework.py",
  "/src/fabric/adapters/crewai.py",
  "/src/fabric/adapters/langgraph.py",
  "/src/fabric/guardrail_adapters",
  "/src/fabric/judge_adapters",
  "/src/fabric/judge_runner.py",
  "/src/fabric/policy_adapters",
  "/src/fabric/queue_transports",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fabric"]
exclude = [
  "/src/fabric/cli.py",
  "/src/fabric/deployment.py",
  "/src/fabric/_chain.py",
  "/src/fabric/_uds.py",
  "/src/fabric/escalation.py",
  "/src/fabric/eval.py",
  "/src/fabric/guardrails.py",
  "/src/fabric/judge.py",
  "/src/fabric/nemo.py",
  "/src/fabric/policy.py",
  "/src/fabric/presidio.py",
  "/src/fabric/stream.py",
  "/src/fabric/tool_auth.py",
  "/src/fabric/auto_instrument.py",
  "/src/fabric/coverage_manifest.py",
  "/src/fabric/_coverage_canary.py",
  "/src/fabric/_instrumentation_registry.py",
  "/src/fabric/distributed_closure.py",
  "/src/fabric/reference_receipts.py",
  "/src/fabric/control_protocol.py",
  "/src/fabric/deployment_state.py",
  "/src/fabric/capture_identity.py",
  "/src/fabric/capture_readback.py",
  "/src/fabric/enterprise.py",
  "/src/fabric/enterprise_preflight.py",
  "/src/fabric/capture_capabilities.py",
  "/src/fabric/adapters/agent_framework.py",
  "/src/fabric/adapters/crewai.py",
  "/src/fabric/adapters/langgraph.py",
  "/src/fabric/guardrail_adapters",
  "/src/fabric/judge_adapters",
  "/src/fabric/judge_runner.py",
  "/src/fabric/policy_adapters",
  "/src/fabric/queue_transports",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=fabric",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fabric"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "PIE", "RET", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# S108: hardcoded /tmp paths are intentional in tests (short paths to
# satisfy Darwin's 104-byte sun_path limit, and invalid paths to
# trigger negative-path assertions).
"tests/**" = ["S101", "PLR2004", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
