[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "singleaxis-fabric"
description = "Customer-controlled OpenTelemetry capture SDK for reconstructing AI agent activity."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "AI5Labs Research OPC Private Limited", email = "fabric@singleaxis.ai" }]
keywords = ["singleaxis", "fabric", "llm", "agent", "observability", "otel", "tracing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "opentelemetry-api>=1.41",
  "opentelemetry-sdk>=1.41",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
otlp = [
  "opentelemetry-exporter-otlp-proto-http>=1.41",
]
# Auto-instrumentation extras for popular LLM SDK families. Each
# pulls the upstream `opentelemetry-instrumentation-<lib>` package
# (Traceloop-authored, jointly maintained with the OTel GenAI WG)
# alongside Fabric's metadata-only content default. The user pip-installs
# the LLM SDK itself separately; the Instrumentor hooks whatever
# version is present at runtime.
#
# Enable via `Fabric.enable_auto_instrumentation()` (or the module-level
# `fabric.auto_instrument.enable_auto_instrumentation()`).
#
# Content capture is disabled by default (raw prompts/completions do
# not land on spans) per Fabric's compliance posture. Override with
# `FABRIC_CAPTURE_LLM_CONTENT=true` or
# `enable_auto_instrumentation(capture_content=True)`.
openai = [
  "opentelemetry-instrumentation-openai-v2>=0.30b0",
]
anthropic = [
  "opentelemetry-instrumentation-anthropic>=0.30b0",
]
bedrock = [
  "opentelemetry-instrumentation-bedrock>=0.30b0",
]
otel-langchain = [
  "opentelemetry-instrumentation-langchain>=0.30b0",
]
cohere = [
  "opentelemetry-instrumentation-cohere>=0.30b0",
]
# Optional MCP (Model Context Protocol) tool-call instrumentation. The
# `fabric.integrations.mcp` module duck-types the client session via a
# local Protocol, so it imports without this extra; the extra only
# pulls the real `mcp` package in for users wiring it to a live server.
mcp = [
  "mcp>=1.0",
]
# Optional generic signature verification (spec 023 §4). The
# `fabric.verify_signature` ed25519 path uses `cryptography` when present
# and otherwise degrades to verified=False; hmac-sha256 is stdlib-only and
# needs nothing here. This extra pulls the real primitive in for users who
# want ed25519 verification.
signing = [
  "cryptography>=42",
]
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "jsonschema>=4.23",
  "types-jsonschema>=4.23",
  "PyYAML>=6.0.2,<7.0",
  "types-PyYAML>=6.0.12",
  "httpx>=0.27",
  "opentelemetry-exporter-otlp-proto-http>=1.41",
  # cryptography exercises the real ed25519 path in the generic
  # signature-verification tests (spec 023); without it ed25519 degrades
  # to verified=False and those asserts are skipped.
  "cryptography>=42",
]

[project.urls]
Homepage      = "https://github.com/singleaxis/singleaxis-fabric"
Repository    = "https://github.com/singleaxis/singleaxis-fabric"
Documentation = "https://github.com/singleaxis/singleaxis-fabric/blob/main/specs/027-recorder-v1.md"
Issues        = "https://github.com/singleaxis/singleaxis-fabric/issues"

[tool.hatch.version]
# VERSION is the repository authority; this checked-in mirror lets wheels,
# sdists, editable installs, and source checkouts report the same identity.
# scripts/verify_release_identity.py rejects a tag or build when they diverge.
path = "src/fabric/_version.py"

[tool.hatch.build.targets.sdist]
# Release sdists are production source artifacts, not test-fixture bundles.
# Conformance goldens are authoritative at the repository-level contracts/
# path and intentionally do not ship as a stale duplicate under tests/.
include = ["/src", "/README.md", "/LICENSE"]
exclude = [
  "/tests",
  "**/.gitignore",
  "/src/fabric/cli.py",
  "/src/fabric/deployment.py",
  "/src/fabric/_chain.py",
  "/src/fabric/_uds.py",
  "/src/fabric/escalation.py",
  "/src/fabric/eval.py",
  "/src/fabric/guardrails.py",
  "/src/fabric/judge.py",
  "/src/fabric/nemo.py",
  "/src/fabric/policy.py",
  "/src/fabric/presidio.py",
  "/src/fabric/stream.py",
  "/src/fabric/tool_auth.py",
  "/src/fabric/adapters/agent_framework.py",
  "/src/fabric/adapters/langgraph.py",
  "/src/fabric/guardrail_adapters",
  "/src/fabric/judge_adapters",
  "/src/fabric/judge_runner.py",
  "/src/fabric/policy_adapters",
  "/src/fabric/queue_transports",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fabric"]
exclude = [
  "/src/fabric/cli.py",
  "/src/fabric/deployment.py",
  "/src/fabric/_chain.py",
  "/src/fabric/_uds.py",
  "/src/fabric/escalation.py",
  "/src/fabric/eval.py",
  "/src/fabric/guardrails.py",
  "/src/fabric/judge.py",
  "/src/fabric/nemo.py",
  "/src/fabric/policy.py",
  "/src/fabric/presidio.py",
  "/src/fabric/stream.py",
  "/src/fabric/tool_auth.py",
  "/src/fabric/adapters/agent_framework.py",
  "/src/fabric/adapters/langgraph.py",
  "/src/fabric/guardrail_adapters",
  "/src/fabric/judge_adapters",
  "/src/fabric/judge_runner.py",
  "/src/fabric/policy_adapters",
  "/src/fabric/queue_transports",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=fabric",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fabric"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "PIE", "RET", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# S108: hardcoded /tmp paths are intentional in tests (short paths to
# satisfy Darwin's 104-byte sun_path limit, and invalid paths to
# trigger negative-path assertions).
"tests/**" = ["S101", "PLR2004", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
