# Pre-commit hooks — https://pre-commit.com
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
        # CO-RE builds require this generated, reviewed kernel type header.
        exclude: ^components/host-emitter/bpf/vmlinux\.h$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        # Helm chart templates contain Go template directives (`{{- if
        # .Values.foo }}`) that are not valid YAML on their own. Exclude
        # anything under a chart's templates/ directory and its test
        # fixtures. Compose v2's !override is also not generic YAML.
        # Chart.yaml / values.yaml remain checked as real YAML.
        exclude: |
          (?x)^(
            charts/.*/templates/.*\.ya?ml|
            charts/.*/tests/.*/expected\.ya?ml|
            deploy/compose/docker-compose\.production\.yml
          )$
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Unified diffs intentionally contain leading '+' followed by context
        # whitespace; rewriting them corrupts the vendored security patch.
        exclude: \.patch$
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Kept in lockstep with the gitleaks version pinned in
  # `.github/workflows/recorder-security.yml` (currently v8.30.1) so
  # local-loop scans and the CI gate run the same detection engine and
  # rule set.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # mypy runs per-package in CI (see `.github/workflows/recorder-ci.yml`,
  # `python-quality` job) against each package's own strict `[tool.mypy]`
  # config and its own dep graph. A repo-root pre-commit mypy with
  # `--ignore-missing-imports` would diverge from CI semantics, so we
  # keep type-checking in CI and keep pre-commit focused on fast
  # local-loop hygiene (ruff, gitleaks, file validity, EOF/whitespace).

  # helm-docs is intentionally NOT a pre-commit hook. The norwoodj/helm-docs
  # hook expects the `helm-docs` binary to already be installed on PATH and
  # errors out otherwise ("Please install helm-docs to run the pre-commit
  # hook"). We don't want `pre-commit run` in CI to require extra tooling
  # installed on the runner — pre-commit is scoped to fast local-loop
  # hygiene (ruff, gitleaks, markdownlint, file validity). Chart doc drift
  # is caught by the dedicated `helm` CI job in `recorder-ci.yml` and by
  # reviewers; bringing helm-docs back as a pre-commit hook would mean
  # either bundling the binary here or requiring every local contributor
  # to `brew install norwoodj/tap/helm-docs` before their first commit.

  # markdownlint-cli2 reads `.markdownlint-cli2.jsonc` from the repo
  # root, which is the single source of truth shared with the CI job
  # (DavidAnson/markdownlint-cli2-action). Earlier we used
  # markdownlint-cli with a different rule list, which drifted from
  # CI — switching to cli2 collapses both into one config.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2

  # actionlint lints .github/workflows/*.yml — the same surface the
  # release-boundary tests scan. The `actionlint` hook id builds the
  # pinned release from source (Go is present on the CI runner and is
  # already required for the fabricctl job).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Commit-message policy (DCO sign-off) is enforced in CI — see the
  # `dco` job in `.github/workflows/recorder-ci.yml`. Running gitlint
  # here duplicates that gate and drifts (two configs to keep in sync),
  # so the CI gate stays the source of truth.
