# Recorder-only example. Supply certificate and queue paths appropriate to
# your environment; use the Helm shadow-production profile for Kubernetes.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/fabric:
    directory: /var/lib/otelcol-fabric/storage
    create_directory: true
    fsync: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  fabricguard:
    event_class_attribute: event_class
    drop_unknown_classes: true
    max_field_bytes: 8192

exporters:
  otlp_http/fabric:
    endpoint: ${env:FABRIC_EXPORT_ENDPOINT}
    headers:
      Authorization: ${env:FABRIC_EXPORT_AUTH}
    tls:
      insecure: false
      insecure_skip_verify: false
    timeout: 30s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 10000
      block_on_overflow: true
      storage: file_storage/fabric
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions: [health_check, file_storage/fabric]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, fabricguard]
      exporters: [otlp_http/fabric]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, fabricguard]
      exporters: [otlp_http/fabric]
