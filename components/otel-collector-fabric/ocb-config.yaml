# OpenTelemetry Collector Builder manifest for the SingleAxis Fabric
# distribution. Build with:
#
#   ocb --config ocb-config.yaml
#
# This produces a custom collector binary at ./dist/otelcol-fabric that
# includes only the recorder's metadata protection processor alongside the
# standard contrib receiver, durable storage, and exporter components.

dist:
  name: otelcol-fabric
  description: SingleAxis Fabric OpenTelemetry Collector distribution
  output_path: ./dist
  version: 0.8.0-rc.1

extensions:
  # health_check extension ships from the contrib distribution; keep
  # the version pinned to the same v0.150.0 as the rest of the manifest.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.150.0
  # Durable exporter queues use the contrib file-storage extension.
  # Merely compiling this component does not make delivery durable: a
  # writable persistent volume and `sending_queue.storage` must also be
  # configured (the Helm chart does both when persistence is enabled).
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.150.0
  # Terminates token-authenticated OTLP ingress for non-Kubernetes
  # deployments — wired on both receivers by the compose production overlay.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.150.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.150.0
  # auditd host connector (spec 030): consumes Linux audit events from the
  # audit netlink multicast or audit.log and emits them as logs. Config-gated;
  # only deployments that enable it take CAP_AUDIT_READ or audit-log access.
  - gomod: github.com/singleaxis/singleaxis-fabric/components/otel-collector-fabric/receiver/auditreceiver v0.1.0
    path: ./receiver/auditreceiver

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.150.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.150.0
  # Fabric's exact metadata allowlist and native-field scrubber.
  - gomod: github.com/singleaxis/singleaxis-fabric/components/otel-collector-fabric/processor/fabricguardprocessor v0.1.0
    path: ./processor/fabricguardprocessor

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.150.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.150.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.56.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.56.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.56.0

# Resolve the recorder processor to its on-disk source for reproducible builds.
replaces:
  - github.com/singleaxis/singleaxis-fabric/components/otel-collector-fabric/processor/fabricguardprocessor => ./processor/fabricguardprocessor
  - github.com/singleaxis/singleaxis-fabric/components/otel-collector-fabric/receiver/auditreceiver => ./receiver/auditreceiver
