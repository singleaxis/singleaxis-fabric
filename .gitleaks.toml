# gitleaks configuration for SingleAxis Fabric.
#
# Consumed by `.github/workflows/recorder-security.yml` (`gitleaks` job)
# and by the `gitleaks` pre-commit hook. We extend the upstream default
# ruleset rather than redefining it from scratch — the `gitleaks:default`
# directive pulls in every built-in detector.
#
# If a future file legitimately trips a detector (a synthetic test vector,
# a protocol constant), add a narrowly-scoped `[allowlist]` entry here with
# a comment explaining WHY the flagged string is safe — never weaken a rule.

[extend]
useDefault = true
