# gitleaks configuration for SingleAxis Fabric.
#
# Consumed by `.github/workflows/recorder-security.yml` (`gitleaks` job)
# and by the `gitleaks` pre-commit hook. We extend the upstream default
# ruleset rather than redefining it from scratch — the `gitleaks:default`
# directive pulls in every built-in detector.
#
# If a future file legitimately trips a detector (a synthetic test vector,
# a protocol constant), add a narrowly-scoped `[allowlist]` entry here with
# a comment explaining WHY the flagged string is safe — never weaken a rule.

[extend]
useDefault = true

# Spec 055 unit 055-t2: test/wire/fixtures/config-env.json is generated by
# scripts/contracts/generate_ts_wire_vectors.py from fixed test values: the
# spool key is base64 of the bytes 0x00..0x1f and the two digests are SHA-256
# of that key and of the documented test id key "fabric-test-id-key-not-a-secret".
# None is a deployment's secret. Scoped to this one file and these exact values.
[[allowlists]]
description = "spec 055 config-env fixture: fixed test keys and their digests"
condition = "AND"
paths = ['''^sdk/typescript/test/wire/fixtures/config-env\.json$''']
regexes = [
  '''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=(\\n)?$''',
  '''^2452c9978e943c447fc96f7afca64524a8beacd9a7f4f1e619075c1ff1f40fd7$''',
  '''^630dcd2966c4336691125448bbb25b4ff412a49c732db2c8abc1b8581bd710dd$''',
]
