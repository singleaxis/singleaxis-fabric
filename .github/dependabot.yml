version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]

  # Python packages — one entry per pyproject.toml location.
  # Single-maintainer project: cap per-ecosystem PRs at 5 and group
  # dev-only deps to reduce churn.





  - package-ecosystem: "pip"
    directory: "/sdk/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python", "sdk"]
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "/examples/harness-smoke"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python", "examples"]
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "/examples/reference-agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python", "examples"]
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "gomod"
    directory: "/tools/fabricctl"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]

  - package-ecosystem: "gomod"
    directory: "/components/otel-collector-fabric/processor/fabricguardprocessor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]

  - package-ecosystem: "docker"
    directory: "/components/otel-collector-fabric"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker", "otel-collector"]
