version: 2
# One entry per live ecosystem; scripts/tests/test_supply_chain_pins.py fails
# when a manifest directory in the repository is not covered here, or when an
# entry names a directory that no longer exists.
#
# Single-maintainer project: cap per-ecosystem PRs at 5 and group related
# updates to reduce churn. The 7-day cooldown applies to version updates only;
# security updates are never delayed.
updates:
  # Workflows and local composite actions. Every `uses:` is pinned to a full
  # commit SHA with a `# vX.Y.Z` comment; Dependabot updates both.
  # codeql-action fails when init/autobuild/analyze/upload-sarif run different
  # versions, so its sub-actions always move as one PR.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]

  # uv.lock projects. CI and release jobs install sdk/python/uv.lock with pip
  # --require-hashes (scripts/ci/install-python-locked.sh).
  - package-ecosystem: "uv"
    directories:
      - "/sdk/python"
      - "/examples/reference-agent"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      opentelemetry:
        patterns: ["opentelemetry-*"]
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "/examples/harness-smoke"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "python", "examples"]
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "typescript", "sdk"]
    groups:
      dev-dependencies:
        dependency-type: "development"
    # Version-update holds. Each rule uses `update-types` only, never
    # `versions`. GitHub documents `ignore` as applying to security updates
    # as well, but for security updates Dependabot honours only a rule's
    # `versions` and skips its `update-types`
    # (dependabot-core Config::IgnoreCondition#ignored_versions). So these
    # rules never block a security update. A `versions` rule would.
    ignore:
      # The published peer range is ">=1.9.0 <1.11.0". The unit suite runs
      # on the 1.9.x floor (this devDependency); the README fresh-install
      # test (scripts/fresh-install.mjs) covers 1.10. Version updates stay
      # on the floor so the floor stays tested.
      - dependency-name: "@opentelemetry/api"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @opentelemetry/sdk-trace-node 2.x still pins context-async-hooks
      # 2.x; hooks 3 arrives with an sdk-trace-node major, not alone.
      - dependency-name: "@opentelemetry/context-async-hooks"
        update-types: ["version-update:semver-major"]
      # Track the Node floor: types must match the oldest supported Node
      # (engines >=22.18.0), so stay on @types/node 22.x.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Hold TypeScript at 5.x: typescript-eslint does not support
      # TypeScript 7 yet, and tsup's dts build needs the TypeScript compiler
      # API that TypeScript 7 does not ship (found in #256).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # License-scan project: the optional @aws-sdk/client-s3 peer and the pinned
  # license scanner. Its client-s3 range must equal the SDK's peer range, so
  # only the lockfile moves for it (the scanner's exact pin is raised).
  - package-ecosystem: "npm"
    directory: "/scripts/license/s3-peer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    labels: ["dependencies", "license-scan"]
    groups:
      license-scan:
        patterns: ["*"]

  # Go modules. The Collector modules are built together by OCB
  # (components/otel-collector-fabric/ocb-config.yaml), so Collector core and
  # contrib bumps arrive as one grouped PR; ocb-config.yaml's versions are
  # raised by hand in the same PR.
  - package-ecosystem: "gomod"
    directories:
      - "/tools/fabricctl"
      - "/components/host-emitter"
      - "/components/otel-collector-fabric/gate"
      - "/components/otel-collector-fabric/hostrecords"
      - "/components/otel-collector-fabric/processor/fabricguardprocessor"
      - "/components/otel-collector-fabric/receiver/auditreceiver"
      - "/components/otel-collector-fabric/exporter/fabriccontentexporter"
      - "/components/otel-collector-fabric/extension/noredirectextension"
      - "/components/otel-collector-fabric/extension/fabricenvelopeextension"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      otel-collector:
        patterns:
          - "go.opentelemetry.io/collector*"
          - "github.com/open-telemetry/opentelemetry-collector-contrib/*"
      opentelemetry-go:
        patterns: ["go.opentelemetry.io/otel*"]

  # Base images, pinned by digest.
  - package-ecosystem: "docker"
    directories:
      - "/components/otel-collector-fabric"
      - "/components/host-emitter"
      - "/examples/redaction-service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker-compose"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
