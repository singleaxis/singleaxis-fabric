name: Implementation slice
description: Propose one bounded, releasable Fabric feature slice.
title: "[slice] "
labels: ["implementation-slice", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Fabric features are delivered as small vertical slices. Read
        `specs/027-recorder-v1.md` (authoritative scope) and `AGENTS.md`
        (boundary rules) before completing this form. The recorder does
        CAPTURE -> PROTECT -> DELIVER only — do not propose enforcement,
        judging, policy, or management surfaces here.

  - type: dropdown
    id: stage
    attributes:
      label: Pipeline stage
      options:
        - Capture (SDKs, connectors, ingress)
        - Protect (allowlist, normalization, privacy)
        - Deliver (queue, retry, exporter, receipts)
        - Cross-cutting (contracts, fabricctl, packaging, docs)
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Customer outcome and acceptance criteria
      description: State the observable result, measurable exit conditions, and explicit non-goals.
    validations:
      required: true

  - type: textarea
    id: ownership
    attributes:
      label: Artifact and ownership
      description: Name the SDK, collector processor, chart, contract family, CLI surface, example, or doc in scope.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Contract and compatibility
      description: Describe schema/fixture changes, supported versions, capability declaration, and migration. Write "No contract change" with a reason when applicable.
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and data handling
      description: Classify inputs/outputs, raw-content behavior, redaction, retention, residency, logs, and error-message exposure.
    validations:
      required: true

  - type: textarea
    id: trust
    attributes:
      label: Trust boundary and authorization
      description: Identify producers, consumers, workload identity, authentication, authorization, secrets, signatures, and cross-boundary egress.
    validations:
      required: true

  - type: textarea
    id: failure
    attributes:
      label: Failure, latency, and recovery
      description: Specify fail-open/fail-closed behavior, timeout, backpressure, queue overflow, loss/duplication semantics, readiness, rollback, and recovery.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: List conformance, unit, adversarial, integration, packaging, upgrade, and released-artifact tests. Include operator diagnostics.
    validations:
      required: true

  - type: dropdown
    id: placement
    attributes:
      label: Implementation placement
      options:
        - Public OSS implementation
        - Public contract only
        - Customer-owned integration
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: Readiness
      options:
        - label: The slice has one primary outcome and can be reviewed independently.
          required: true
        - label: Raw content is disabled by default or the exception is explicitly justified.
          required: true
        - label: The slice does not expand the recorder beyond CAPTURE -> PROTECT -> DELIVER.
          required: true
        - label: Documentation and release-artifact qualification are included in the definition of done.
          required: true
