name: Bug report
description: Report a reproducible defect in Fabric.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before filing, please confirm:
        - This is not a security vulnerability (if it is, use the Security Advisory flow).
        - You have searched existing issues for a duplicate.

  - type: input
    id: fabric-version
    attributes:
      label: Fabric version
      description: "`helm ls -n fabric-system` or the Git SHA you're running."
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Helm — shadow-dev profile
        - Helm — shadow-production profile
        - Docker Compose — evaluation stack
        - Docker Compose — production overlay
        - SDK only (Python)
        - SDK only (TypeScript)
        - Other / custom
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment details
      description: "Kubernetes version (`kubectl version --short`), Docker/Compose version, or runtime where relevant."

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the unexpected behaviour.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or code to reproduce.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / metrics
      description: Redact anything sensitive before pasting.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: No customer data, PII, or secrets are included in this issue.
          required: true
        - label: I have searched existing issues.
          required: true
