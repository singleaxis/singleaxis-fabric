name: Set up pinned uv
description: >-
  Installs one pinned uv release (checksum-verified by setup-uv) for
  scripts/ci/install-python-locked.sh, which exports sdk/python/uv.lock and
  installs it with pip --require-hashes. No cache: release jobs must not
  restore state written by other runs.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.11.6"
        enable-cache: false
