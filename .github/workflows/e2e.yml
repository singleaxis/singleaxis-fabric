name: E2E kind smoke

# Qualifies Fabric Node and an installed-wheel synthetic agent fixture:
# model -> terminal -> binary artifact -> model, then AEEP metadata through
# default-deny protection -> persistent queue -> controlled test sink.
# The sink returns 200 after fsync, allowing this workflow to test outage and
# restart recovery without claiming that arbitrary OTLP destinations have the
# same persistence semantics.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect relevant changes
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the Pulls listFiles API on pull_request
    # events, which requires pull-requests:read beyond the workflow-level
    # contents:read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            relevant:
              - 'charts/fabric/**'
              - 'components/otel-collector-fabric/**'
              - 'deploy/compose/**'
              - 'sdk/python/**'
              - 'scripts/qualification/run_synthetic_agent_pilot.py'
              - 'scripts/qualification/synthetic_agent_tool.py'
              - 'scripts/qualification/verify_synthetic_sink_readback.py'
              - 'qualification/synthetic-slice/end-to-end-agent-pilot-plan.md'
              - '.github/workflows/e2e.yml'
      # Manual dispatch has no diff context for paths-filter — always run the
      # smoke rather than silently skipping the only end-to-end gate.
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ steps.filter.outputs.relevant }}" = "true" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  kind-smoke:
    name: kind cluster install + smoke
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_CLUSTER: fabric-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      NAMESPACE: fabric-system
      COLLECTOR_IMAGE: fabric-otelcol:e2e
    steps:
      - name: Short-circuit unrelated changes
        if: needs.detect.outputs.relevant != 'true'
        run: echo "No Fabric Node runtime or packaging changes; smoke not required."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.detect.outputs.relevant == 'true'

      - name: Set up Docker Buildx
        if: needs.detect.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Fabric Node Collector image
        if: needs.detect.outputs.relevant == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: components/otel-collector-fabric
          file: components/otel-collector-fabric/Dockerfile
          push: false
          load: true
          tags: ${{ env.COLLECTOR_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        if: needs.detect.outputs.relevant == 'true'
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          node_image: kindest/node:v1.30.0
          version: v0.23.0
          wait: 120s

      - name: Load Fabric Node image
        if: needs.detect.outputs.relevant == 'true'
        run: kind load docker-image "${COLLECTOR_IMAGE}" --name "${KIND_CLUSTER}"

      - name: Set up Helm
        if: needs.detect.outputs.relevant == 'true'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.15.0

      - name: Package and identify exact chart and Node image
        if: needs.detect.outputs.relevant == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/fabric-chart"
          helm package charts/fabric --destination "${RUNNER_TEMP}/fabric-chart"
          sha256sum "${RUNNER_TEMP}"/fabric-chart/fabric-*.tgz \
            | tee "${RUNNER_TEMP}/fabric-chart.sha256"
          docker image inspect "${COLLECTOR_IMAGE}" --format '{{.Id}}' \
            | tee "${RUNNER_TEMP}/fabric-node-image-id.txt"

      - name: Install controlled fsync test sink
        if: needs.detect.outputs.relevant == 'true'
        run: |
          kubectl create namespace "${NAMESPACE}"
          kubectl create configmap fabric-test-sink \
            --namespace "${NAMESPACE}" \
            --from-file=otlp_sink.py=deploy/compose/sink/otlp_sink.py
          kubectl apply --namespace "${NAMESPACE}" -f - <<'YAML'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: fabric-test-sink
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: fabric-test-sink
          spec:
            replicas: 1
            selector:
              matchLabels: {app: fabric-test-sink}
            template:
              metadata:
                labels: {app: fabric-test-sink}
              spec:
                containers:
                  - name: sink
                    image: python:3.12-alpine
                    command: [python, /app/otlp_sink.py]
                    env:
                      - {name: SINK_DATA_DIR, value: /data}
                      - {name: SINK_PORT, value: "8080"}
                    ports:
                      - {name: http, containerPort: 8080}
                    readinessProbe:
                      httpGet: {path: /health, port: http}
                      periodSeconds: 2
                    volumeMounts:
                      - {name: script, mountPath: /app, readOnly: true}
                      - {name: data, mountPath: /data}
                volumes:
                  - name: script
                    configMap: {name: fabric-test-sink}
                  - name: data
                    persistentVolumeClaim: {claimName: fabric-test-sink}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: fabric-test-sink
          spec:
            selector: {app: fabric-test-sink}
            ports:
              - {name: http, port: 8080, targetPort: http}
          YAML
          kubectl rollout status deployment/fabric-test-sink \
            --namespace "${NAMESPACE}" --timeout=180s

      - name: Install Collector-only Fabric Node
        if: needs.detect.outputs.relevant == 'true'
        run: |
          helm install fabric-node "${RUNNER_TEMP}"/fabric-chart/fabric-*.tgz \
            --namespace "${NAMESPACE}" \
            --values charts/fabric/profiles/shadow-dev.yaml \
            --set namespace.create=false \
            --set otel-collector.image.repository=fabric-otelcol \
            --set otel-collector.image.tag=e2e \
            --set otel-collector.image.pullPolicy=IfNotPresent \
            --set otel-collector.exporter.endpoint=http://fabric-test-sink:8080 \
            --set otel-collector.exporter.sendingQueue.persistence.enabled=true \
            --set otel-collector.exporter.sendingQueue.persistence.fsync=true \
            --set otel-collector.exporter.sendingQueue.persistence.size=1Gi \
            --set otel-collector.exporter.sendingQueue.blockOnOverflow=true \
            --set otel-collector.exporter.retry.maxElapsedTime=0s \
            --set otel-collector.exporter.requireDurableQueue=true \
            --set otel-collector.batch.enabled=false \
            --set otel-collector.debugExporter.enabled=false \
            --wait --timeout 5m
          kubectl wait --for=condition=ready pods \
            --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector --timeout=300s

      - name: Verify capture, protection, and delivery
        if: needs.detect.outputs.relevant == 'true'
        run: |
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-node-otel-collector 14318:4318 &
          NODE_PF=$!
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-test-sink 18080:8080 &
          SINK_PF=$!
          trap 'kill ${NODE_PF} ${SINK_PF} 2>/dev/null || true' EXIT
          sleep 3

          BEFORE=$(curl -fsS http://127.0.0.1:18080/count | jq -r .count)
          curl -fsS -X POST http://127.0.0.1:14318/v1/traces \
            -H 'Content-Type: application/json' \
            --data-binary @deploy/compose/fixtures/decision-summary.json

          for attempt in $(seq 1 30); do
            echo "delivery poll ${attempt}/30"
            CURRENT=$(curl -fsS http://127.0.0.1:18080/count | jq -r .count)
            if [ "${CURRENT}" -gt "${BEFORE}" ]; then break; fi
            sleep 1
          done
          test "${CURRENT}" -gt "${BEFORE}"
          test "$(curl -fsS 'http://127.0.0.1:18080/contains?needle=MUST_NOT_LEAVE_FABRIC_NODE' | jq -r .found)" = false

      - name: Verify destination outage and Collector restart recovery
        if: needs.detect.outputs.relevant == 'true'
        run: |
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-node-otel-collector 14318:4318 &
          NODE_PF=$!
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-test-sink 18080:8080 &
          SINK_PF=$!
          trap 'kill ${NODE_PF} ${SINK_PF} 2>/dev/null || true' EXIT
          sleep 3
          BEFORE=$(curl -fsS http://127.0.0.1:18080/count | jq -r .count)

          kubectl scale deployment/fabric-test-sink --namespace "${NAMESPACE}" --replicas=0
          kubectl wait --for=delete pods --namespace "${NAMESPACE}" -l app=fabric-test-sink --timeout=120s
          curl -fsS -X POST http://127.0.0.1:14318/v1/traces \
            -H 'Content-Type: application/json' \
            --data-binary @deploy/compose/fixtures/decision-summary.json
          sleep 3

          COLLECTOR=$(kubectl get pod --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector \
            -o jsonpath='{.items[0].metadata.name}')
          kill "${NODE_PF}" 2>/dev/null || true
          kubectl delete pod "${COLLECTOR}" --namespace "${NAMESPACE}"
          kubectl wait --for=condition=ready pods --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector --timeout=300s

          kubectl scale deployment/fabric-test-sink --namespace "${NAMESPACE}" --replicas=1
          kubectl rollout status deployment/fabric-test-sink \
            --namespace "${NAMESPACE}" --timeout=180s
          kill "${SINK_PF}" 2>/dev/null || true
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-test-sink 18080:8080 &
          SINK_PF=$!
          sleep 3

          CURRENT=0
          for attempt in $(seq 1 45); do
            echo "recovery poll ${attempt}/45"
            CURRENT=$(curl -fsS http://127.0.0.1:18080/count | jq -r .count)
            if [ "${CURRENT}" -gt "${BEFORE}" ]; then break; fi
            sleep 1
          done
          test "${CURRENT}" -gt "${BEFORE}"
          echo "At-least-once recovery reached the controlled fsync sink."
          echo "This does not prove exactly-once delivery or persistence at arbitrary destinations."

      - name: Helm test
        if: needs.detect.outputs.relevant == 'true'
        run: helm test fabric-node --namespace "${NAMESPACE}" --timeout 2m

      - name: Set up Python for exact installed-wheel pilot
        if: needs.detect.outputs.relevant == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Build and install exact Python wheel
        if: needs.detect.outputs.relevant == 'true'
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --outdir "${RUNNER_TEMP}/fabric-wheel" sdk/python
          python -m venv "${RUNNER_TEMP}/fabric-agent-venv"
          "${RUNNER_TEMP}/fabric-agent-venv/bin/python" -m pip install \
            "${RUNNER_TEMP}"/fabric-wheel/singleaxis_fabric-*.whl
          sha256sum "${RUNNER_TEMP}"/fabric-wheel/singleaxis_fabric-*.whl \
            | tee "${RUNNER_TEMP}/fabric-wheel.sha256"

      - name: Reconcile installed-wheel agent run and sink metadata
        if: needs.detect.outputs.relevant == 'true'
        run: |
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-node-otel-collector 14318:4318 &
          NODE_PF=$!
          kubectl port-forward --namespace "${NAMESPACE}" \
            service/fabric-test-sink 18080:8080 &
          SINK_PF=$!
          trap 'kill ${NODE_PF} ${SINK_PF} 2>/dev/null || true' EXIT
          sleep 3
          curl -fsS http://127.0.0.1:18080/health
          "${RUNNER_TEMP}/fabric-agent-venv/bin/python" \
            scripts/qualification/run_synthetic_agent_pilot.py \
            --node-url http://127.0.0.1:14318/v1/logs \
            --sink-url http://127.0.0.1:18080 \
            --report-path "${RUNNER_TEMP}/fabric-agent-pilot-report.json"

      - name: Parse fsynced sink records and check Collector logs
        if: needs.detect.outputs.relevant == 'true'
        run: |
          "${RUNNER_TEMP}/fabric-agent-venv/bin/python" -m pip install \
            opentelemetry-proto==1.44.0
          SINK_POD=$(kubectl get pod --namespace "${NAMESPACE}" \
            -l app=fabric-test-sink -o jsonpath='{.items[0].metadata.name}')
          kubectl cp "${NAMESPACE}/${SINK_POD}:/data" \
            "${RUNNER_TEMP}/fabric-sink-data"
          "${RUNNER_TEMP}/fabric-agent-venv/bin/python" \
            scripts/qualification/verify_synthetic_sink_readback.py \
            --report-path "${RUNNER_TEMP}/fabric-agent-pilot-report.json" \
            --sink-dir "${RUNNER_TEMP}/fabric-sink-data"
          if kubectl logs --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector --tail=-1 \
            | grep -Fq 'PILOT_SECRET_CANARY_do_not_export'; then
            echo 'Privacy canary appeared in Collector logs' >&2
            exit 1
          fi

      - name: Publish synthetic pilot evidence
        if: always() && needs.detect.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-agent-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fabric-agent-pilot-report.json
            ${{ runner.temp }}/fabric-wheel.sha256
            ${{ runner.temp }}/fabric-chart.sha256
            ${{ runner.temp }}/fabric-node-image-id.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnostics
        if: failure() && needs.detect.outputs.relevant == 'true'
        run: |
          kubectl get all,pvc --namespace "${NAMESPACE}" || true
          kubectl describe pods --namespace "${NAMESPACE}" || true
          kubectl logs --namespace "${NAMESPACE}" \
            -l app.kubernetes.io/name=otel-collector --tail=500 || true
          kubectl logs --namespace "${NAMESPACE}" \
            -l app=fabric-test-sink --tail=500 || true
          kubectl get events --namespace "${NAMESPACE}" --sort-by=.lastTimestamp || true
