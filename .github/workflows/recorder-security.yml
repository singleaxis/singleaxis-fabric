name: Recorder security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/synthetic-evidence-qualification-20260927]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: recorder-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install verified gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          workdir="$(mktemp -d)"
          cd "${workdir}"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sha256sum --check -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan the complete public repository
        run: gitleaks detect --source . --redact --verbose --exit-code 1
      - name: Verify historical exceptions still reject a new credential
        run: python3 scripts/qualification/check_secret_scan_baseline.py

  trivy:
    name: Released dependency scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-sdk
            path: sdk/python
          - name: typescript-sdk
            path: sdk/typescript
          - name: fabric-node
            # Go-module scan for the guard processor of the image.
            # The assembled OCB dependency graph is scanned on the built image
            # in recorder-ci.yml.
            path: components/otel-collector-fabric/processor/fabricguardprocessor
          - name: mapping-processor
            # Spec 057 §4.5: the Node's attribute mapping processor.
            path: components/otel-collector-fabric/processor/fabricmapprocessor
          - name: audit-receiver
            path: components/otel-collector-fabric/receiver/auditreceiver
          - name: content-exporter
            # Spec 048: the Node's content writer (aws-sdk-go-v2 for S3).
            path: components/otel-collector-fabric/exporter/fabriccontentexporter
          - name: noredirect-extension
            # Spec 048 J4: the Node's redirect-refusing HTTP client middleware.
            path: components/otel-collector-fabric/extension/noredirectextension
          - name: envelope-extension
            # Spec 049 §7.8: the Node's encrypted queue storage wrapper.
            path: components/otel-collector-fabric/extension/fabricenvelopeextension
          - name: host-records
            # Spec 056 WP4-07a: the host-records library of both host sensors.
            path: components/otel-collector-fabric/hostrecords
          - name: host-emitter
            path: components/host-emitter
          - name: fabricctl
            path: tools/fabricctl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.path }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          limit-severities-for-sarif: "true"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-recorder-${{ matrix.name }}

  semgrep:
    name: Released source SAST
    runs-on: ubuntu-latest
    container: semgrep/semgrep@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade # 1.174.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Scan recorder release source only
        run: >-
          semgrep scan --config auto --error --sarif --output semgrep-recorder.sarif
          sdk/python/src/fabric
          sdk/typescript/src
          components/otel-collector-fabric/processor/fabricguardprocessor
          components/otel-collector-fabric/processor/fabricmapprocessor
          components/otel-collector-fabric/receiver/auditreceiver
          components/otel-collector-fabric/exporter/fabriccontentexporter
          components/otel-collector-fabric/extension/noredirectextension
          components/otel-collector-fabric/extension/fabricenvelopeextension
          components/otel-collector-fabric/hostrecords
          components/host-emitter
          tools/fabricctl/cmd/fabricctl/release_main.go
          tools/fabricctl/internal/recorder
          tools/fabricctl/internal/recorderinit
      - name: Report generated finding locations
        if: always()
        run: python3 scripts/qualification/summarize_sarif.py semgrep-recorder.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: semgrep-recorder.sarif
          category: semgrep-recorder

  osv:
    name: Released lockfile vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # osv-scanner v2 has no --lockfile-only or --skip-git (git roots are no
      # longer scanned by default). Each released lockfile is named with
      # --lockfile, so the scan covers exactly the released dependency sets.
      # test_host_sensor_security_gates.py fails when a lockfile under these
      # module directories is missing here. Usage errors exit non-zero in v2
      # (v1.9.0's wrapper reported success after rejecting --lockfile-only).
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            scan
            source
            --lockfile=sdk/python/uv.lock
            --lockfile=sdk/typescript/package-lock.json
            --lockfile=components/otel-collector-fabric/processor/fabricguardprocessor/go.mod
            --lockfile=components/otel-collector-fabric/processor/fabricmapprocessor/go.mod
            --lockfile=components/otel-collector-fabric/receiver/auditreceiver/go.mod
            --lockfile=components/otel-collector-fabric/exporter/fabriccontentexporter/go.mod
            --lockfile=components/otel-collector-fabric/extension/noredirectextension/go.mod
            --lockfile=components/otel-collector-fabric/extension/fabricenvelopeextension/go.mod
            --lockfile=components/otel-collector-fabric/hostrecords/go.mod
            --lockfile=components/host-emitter/go.mod
            --lockfile=tools/fabricctl/go.mod

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: scorecard.sarif
