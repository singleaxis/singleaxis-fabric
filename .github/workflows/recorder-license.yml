name: Recorder license compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/synthetic-evidence-qualification-20260927]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 2"

concurrency:
  group: recorder-license-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python SDK licenses (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [otlp, s3, mcp, signing, hooks-sandbox-e2b, cli]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv
      - name: Inventory released SDK dependencies
        # The extra's locked closure from sdk/python/uv.lock (pip --require-hashes)
        # plus the locked pip-licenses; the SDK itself is ignored by the gate.
        run: |
          python -m venv /tmp/fabric-license-python
          FABRIC_PYTHON=/tmp/fabric-license-python/bin/python scripts/ci/install-python-locked.sh \
            --no-default-groups --group license --extra '${{ matrix.extra }}'
          . /tmp/fabric-license-python/bin/activate
          mkdir -p raw
          pip-licenses --format=json \
            --ignore-packages pip-licenses prettytable wcwidth tomli pip setuptools wheel hatchling hatch-vcs pathspec trove-classifiers \
            > raw/python-${{ matrix.extra }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorder-license-python-${{ matrix.extra }}
          path: raw/
          retention-days: 14

  typescript:
    name: TypeScript SDK licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Inventory production dependencies
        run: |
          npm ci --prefix sdk/typescript
          mkdir -p raw
          # The optional S3 peer is a supported install surface but is not in
          # the base lockfile. Scan it in its own locked project,
          # scripts/license/s3-peer, which must declare the range package.json
          # declares and also pins the license scanner (no npx download).
          # Installing it into sdk/typescript with --package-lock=false
          # re-resolved the SDK's whole dev tree from the registry (vitest's
          # peer set), which npm 10 crashes on ("reading 'edgesOut'"); the SDK's
          # own dependencies are covered by the lockfile scan below.
          peer_dir=scripts/license/s3-peer
          node -e '
            const [sdk, scan] = process.argv.slice(1).map((f) => require(f));
            const peer = sdk.peerDependencies["@aws-sdk/client-s3"];
            const scanned = scan.dependencies["@aws-sdk/client-s3"];
            if (!peer || peer !== scanned) {
              console.error("s3-peer scans " + scanned + ", the SDK declares " + peer);
              process.exit(1);
            }' "${GITHUB_WORKSPACE}/sdk/typescript/package.json" "${GITHUB_WORKSPACE}/${peer_dir}/package.json"
          npm ci --prefix "${peer_dir}" --ignore-scripts --no-audit --no-fund
          checker="${peer_dir}/node_modules/.bin/license-checker-rseidelsohn"
          "${checker}" --production --json \
            --start sdk/typescript > raw/npm-typescript.json
          "${checker}" --production --json --excludePrivatePackages \
            --start "${peer_dir}" > raw/npm-typescript-s3.json
          # Fail closed if the scan did not see the peer.
          grep -q '"@aws-sdk/client-s3@' raw/npm-typescript-s3.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorder-license-typescript
          path: raw/
          retention-days: 14

  go:
    name: Fabric Node and CLI licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Install license and Collector build tools
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go install go.opentelemetry.io/collector/cmd/builder@v0.164.0
      - name: Build and inventory the released Collector
        working-directory: components/otel-collector-fabric
        run: |
          "$(go env GOPATH)/bin/builder" --config ocb-config.yaml
          sh ./upstream/build-patched-bearertokenauth.sh
          mkdir -p "${GITHUB_WORKSPACE}/raw"
          cd dist
          go mod download
          "$(go env GOPATH)/bin/go-licenses" report ./... \
            --ignore github.com/singleaxis/singleaxis-fabric \
            --ignore go.opentelemetry.io/collector/cmd/builder \
            > "${GITHUB_WORKSPACE}/raw/go-fabric-node.csv"
      - name: Inventory the released CLI
        working-directory: tools/fabricctl
        run: |
          "$(go env GOPATH)/bin/go-licenses" report ./cmd/fabricctl \
            --ignore github.com/singleaxis/singleaxis-fabric \
            > "${GITHUB_WORKSPACE}/raw/go-fabricctl.csv"
      - name: Inventory the image entrypoint gate
        working-directory: components/otel-collector-fabric/gate
        run: |
          "$(go env GOPATH)/bin/go-licenses" report ./... \
            --ignore github.com/singleaxis/singleaxis-fabric \
            > "${GITHUB_WORKSPACE}/raw/go-fabric-gate.csv"
      - name: Inventory the host emitter
        working-directory: components/host-emitter
        run: |
          "$(go env GOPATH)/bin/go-licenses" report ./... \
            --ignore github.com/singleaxis/singleaxis-fabric \
            > "${GITHUB_WORKSPACE}/raw/go-host-emitter.csv"
      - name: Inventory the host-records library
        # Spec 056 WP4-07a: compiled into the auditd receiver and the eBPF
        # emitter. Only the library package ships; cmd/hostrecords-replay is
        # test-only and never built by an image or a release.
        working-directory: components/otel-collector-fabric/hostrecords
        run: |
          "$(go env GOPATH)/bin/go-licenses" report . \
            --ignore github.com/singleaxis/singleaxis-fabric \
            > "${GITHUB_WORKSPACE}/raw/go-hostrecords.csv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorder-license-go
          path: raw/
          retention-days: 14

  gate:
    name: Recorder license gate and procurement report
    runs-on: ubuntu-latest
    needs: [python, typescript, go]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: recorder-license-*
          merge-multiple: true
          path: raw
      - name: Enforce allowlist and build procurement report
        run: |
          mkdir -p build/recorder-license-report
          python scripts/license_check.py \
            --policy .github/license-allowlist.txt \
            --pip 'sdk/python=raw/python-otlp.json' \
            --pip 'sdk/python=raw/python-s3.json' \
            --pip 'sdk/python=raw/python-mcp.json' \
            --pip 'sdk/python=raw/python-signing.json' \
            --pip 'sdk/python=raw/python-hooks-sandbox-e2b.json' \
            --pip 'sdk/python=raw/python-cli.json' \
            --npm 'sdk/typescript=raw/npm-typescript.json' \
            --npm 'sdk/typescript=raw/npm-typescript-s3.json' \
            --go 'fabric-node=raw/go-fabric-node.csv' \
            --go 'fabricctl=raw/go-fabricctl.csv' \
            --go 'fabric-gate=raw/go-fabric-gate.csv' \
            --go 'host-emitter=raw/go-host-emitter.csv' \
            --go 'hostrecords=raw/go-hostrecords.csv' \
            --ignore go.opentelemetry.io/collector/cmd/builder \
            --ignore @singleaxis/fabric \
            --ignore singleaxis-fabric \
            --md build/recorder-license-report/THIRD-PARTY-LICENSES.md \
            --csv build/recorder-license-report/third-party-licenses.csv \
            --json build/recorder-license-report/third-party-licenses.json
      - name: Upload procurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorder-third-party-license-report
          path: build/recorder-license-report/
          retention-days: 90
