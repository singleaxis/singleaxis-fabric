name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Workflow-level permissions are read-only. Each job that needs
# write/id-token escalates explicitly in its own permissions: block.
# This narrows the blast radius of any compromise to the one step
# that actually needs the privilege.
permissions:
  contents: read

jobs:
  ci-green:
    name: Require exact-SHA release evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify all required workflows succeeded on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/release/verify_workflow_runs.py
          --repository "${GITHUB_REPOSITORY}"
          --sha "${GITHUB_SHA}"
          --policy scripts/release/release-policy.json
          --output release-workflow-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-workflow-evidence
          path: release-workflow-evidence.json
          retention-days: 90

  verify-tag:
    name: Verify tag, source identity, and main ancestry
    runs-on: ubuntu-latest
    needs: ci-green
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source-commit: ${{ steps.identity.outputs.source-commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Ensure tag points to a commit on main
        run: |
          git fetch origin main --depth=100
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF} is not on main; refusing to release."
            exit 1
          fi
      - id: identity
        name: Verify coordinated release identity
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          python scripts/verify_release_identity.py \
            --expected "${EXPECTED_VERSION}" --json
          echo "version=$(tr -d '\n' < VERSION)" >> "${GITHUB_OUTPUT}"
          echo "source-commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  qualify-release:
    name: Qualify release artifacts
    runs-on: ubuntu-latest
    # Release-note validation is part of the pre-publication gate. Every
    # registry publisher depends on this job, so a missing changelog entry
    # cannot create a partial registry release.
    needs: [verify-tag, changelog]
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # npm trusted publishing requires npm 11.5.1 or newer. Node 24
          # runners ship a qualifying npm CLI; the publish job fails closed
          # if that runner contract ever changes.
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "v3.15.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-workflow-evidence
          path: qualification
      - name: Build Python distribution
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build and qualify TypeScript distribution once
        working-directory: sdk/typescript
        run: |
          npm ci
          npm version "${VERSION}" --no-git-tag-version --allow-same-version --ignore-scripts
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm run test:package
          npm run package:qualified -- \
            --destination "${GITHUB_WORKSPACE}/qualification/npm" \
            --expected-version "${VERSION}" \
            --smoke
      - name: Build and qualify public contracts once
        run: |
          python scripts/release/package_contracts.py \
            --contracts-dir contracts \
            --policy scripts/release/release-policy.json \
            --version "v${VERSION}" \
            --output-dir qualification/contracts \
            --output qualification/contracts/contracts-qualification.json
      - name: Stamp and package Helm chart
        run: |
          python scripts/release/qualify_release.py \
            --policy scripts/release/release-policy.json \
            --tag "v${VERSION}" \
            --chart-dir charts/fabric \
            --stamp-chart \
            --output qualification/chart-stamp.json
          helm lint charts/fabric
          helm package charts/fabric --destination qualification/chart
      - name: Qualify exact publication artifacts
        run: |
          chart_package=$(find qualification/chart -maxdepth 1 -name 'fabric-*.tgz' -type f)
          python scripts/release/qualify_release.py \
            --policy scripts/release/release-policy.json \
            --tag "v${VERSION}" \
            --commit-sha "${GITHUB_SHA}" \
            --workflow-evidence qualification/release-workflow-evidence.json \
            --chart-dir charts/fabric \
            --chart-package "${chart_package}" \
            --dist-dir sdk/python/dist \
            --smoke-install \
            --output qualification/release-qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-python-dist
          path: sdk/python/dist/*
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-chart
          path: qualification/chart/*.tgz
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-typescript-dist
          path: |
            qualification/npm/*.tgz
            qualification/npm/SHA256SUMS.typescript
            qualification/npm/typescript-package.json
            qualification/npm/npm-pack-metadata.json
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-contracts
          path: |
            qualification/contracts/*.tar.gz
            qualification/contracts/SHA256SUMS.contracts
            qualification/contracts/contracts-qualification.json
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-qualification
          path: qualification/release-qualification.json
          retention-days: 90

  changelog:
    name: Extract changelog entry
    runs-on: ubuntu-latest
    needs: verify-tag
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate CHANGELOG `[Unreleased]` keep-alive
        # SPEC 016 §4.6: every release must leave a live `[Unreleased]`
        # section AND a matching `[Unreleased]: ...HEAD` link reference
        # in CHANGELOG.md so subsequent PRs do not fail markdownlint
        # MD053. The check is its own unit-tested script so the regex
        # cannot drift between release-time and pytest.
        run: python scripts/check_changelog_keep_alive.py CHANGELOG.md
      - id: extract
        name: Extract release notes for this version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re, sys
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.S)
          if not m:
              sys.stderr.write(
                  f"::error::No `## [{version}]` heading found in CHANGELOG.md. "
                  f"Add a release entry for {version} before tagging, or retag "
                  f"after updating the changelog. Refusing to release with a "
                  f"placeholder body.\n"
              )
              sys.exit(1)
          body = m.group(0).strip()
          delim = "EOF_NOTES"
          print(f"notes<<{delim}")
          print(body)
          print(delim)
          PY

  package-fabricctl:
    name: Package qualified fabricctl binaries
    runs-on: ubuntu-latest
    needs: [qualify-release, verify-tag]
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
          cache: false
      - name: Cross-compile and package fabricctl
        working-directory: tools/fabricctl
        run: |
          set -euo pipefail
          build_date=$(git show -s --format=%cI "${SOURCE_COMMIT}")
          source_epoch=$(git show -s --format=%ct "${SOURCE_COMMIT}")
          stage="${RUNNER_TEMP}/fabricctl-release"
          dist="${GITHUB_WORKSPACE}/fabricctl-dist"
          mkdir -p "${stage}" "${dist}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            target_dir="${stage}/${goos}-${goarch}"
            binary="fabricctl"
            if [ "${goos}" = "windows" ]; then
              binary="fabricctl.exe"
            fi
            mkdir -p "${target_dir}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${SOURCE_COMMIT} -X main.buildDate=${build_date}" \
                -o "${target_dir}/${binary}" ./cmd/fabricctl
            touch -d "@${source_epoch}" "${target_dir}/${binary}"
            go version -m "${target_dir}/${binary}"

            archive="fabricctl_${VERSION}_${goos}_${goarch}"
            if [ "${goos}" = "windows" ]; then
              (cd "${target_dir}" && zip -X -q "${dist}/${archive}.zip" "${binary}")
            else
              tar --sort=name --mtime="@${source_epoch}" --owner=0 --group=0 --numeric-owner \
                -C "${target_dir}" -cf - "${binary}" | gzip -n > "${dist}/${archive}.tar.gz"
            fi
          done

          "${stage}/linux-amd64/fabricctl" version \
            | grep -F "fabricctl ${VERSION} (commit ${SOURCE_COMMIT}, built ${build_date})"
          (cd "${dist}" && sha256sum fabricctl_* > fabricctl-SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            fabricctl-dist/fabricctl_*.tar.gz
            fabricctl-dist/fabricctl_*.zip
            fabricctl-dist/fabricctl-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabricctl-release
          path: fabricctl-dist/*
          if-no-files-found: error
          retention-days: 90

  publish-image:
    name: Build and publish ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [qualify-release, verify-tag]
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: otel-collector-fabric
            image: fabric-otelcol
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.image }}
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: components/${{ matrix.component }}
          file: components/${{ matrix.component }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless via Fulcio)
        env:
          COSIGN_EXPERIMENTAL: "1"
          # docker/metadata-action emits multiple tags separated by
          # newlines (e.g. "0.1.0" + "latest" for non-prerelease tags).
          # Pipe via env var + while-read so bash handles the multiline
          # input correctly. A direct `for` over the action interpolation
          # mangles the second line and fails with a syntax error.
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign every pushed tag by its immutable digest so the
          # signature survives tag re-pointing.
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            ref="${tag}@${DIGEST}"
            echo "cosign sign ${ref}"
            cosign sign --yes "${ref}"
          done <<< "${TAGS}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-chart:
    name: Package and publish Helm chart
    runs-on: ubuntu-latest
    needs: qualify-release
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      REGISTRY: ghcr.io
      OCI_REF: oci://ghcr.io/${{ github.repository_owner }}/charts
      CHART_DIR: charts/fabric
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-chart
          path: dist
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "v3.15.0"
      # Both logins are needed: `helm push` uses the helm-specific
      # credential store, but `cosign sign` reads ~/.docker/config.json
      # to pull the just-pushed manifest by digest. Without docker
      # login, cosign hits a 401 from ghcr.io/token on signing.
      - name: Log in to GHCR (docker auth for cosign)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "${REGISTRY}" \
                --username "${{ github.actor }}" --password-stdin
      - name: Select qualified chart
        id: package
        run: |
          pkg="$(ls dist/*.tgz)"
          echo "pkg=${pkg}" >> "$GITHUB_OUTPUT"
          chart_version="$(helm show chart "${pkg}" | awk '/^version:/{print $2}')"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
      - name: Push chart to GHCR OCI
        id: push
        run: |
          out=$(helm push "${{ steps.package.outputs.pkg }}" "${OCI_REF}" 2>&1)
          echo "${out}"
          # helm push writes `Digest: sha256:...` to stderr/stdout.
          digest=$(echo "${out}" | awk '/Digest:/ {print $2}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign chart artifact
        env:
          COSIGN_EXPERIMENTAL: "1"
          CHART_NAME: fabric
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/charts/${CHART_NAME}:${{ steps.package.outputs.chart_version }}@${{ steps.push.outputs.digest }}"
          echo "cosign sign ${ref}"
          cosign sign --yes "${ref}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chart-package
          path: dist/*.tgz
          retention-days: 90

  publish-pypi:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    needs: qualify-release
    # Trusted publishing needs id-token; no PyPI token secret required.
    # Pre-req (one-time): configure a "pending publisher" on pypi.org
    # pointing at this workflow. After the first successful publish,
    # it auto-promotes to a regular trusted publisher.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  publish-npm:
    name: Publish TypeScript SDK to npm beta
    runs-on: ubuntu-latest
    needs: qualify-release
    # One-time registry prerequisite: configure npm trusted publishing for
    # package @singleaxis/fabric, repository singleaxis/singleaxis-fabric,
    # and workflow release.yml. No long-lived npm token is used.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-typescript-dist
          path: dist
      - name: Verify and publish the qualified bytes
        working-directory: dist
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { throw new Error("npm >=11.5.1 is required for trusted publishing") }' "${npm_version}"
          sha256sum --check SHA256SUMS.typescript
          package="$(find . -maxdepth 1 -name 'singleaxis-fabric-*.tgz' -type f -print -quit)"
          test -n "${package}"
          test "$(find . -maxdepth 1 -name 'singleaxis-fabric-*.tgz' -type f | wc -l)" -eq 1
          version="$(node -p 'require("./typescript-package.json").version')"
          integrity="$(node -p 'require("./typescript-package.json").integrity')"
          if published_integrity="$(npm view "@singleaxis/fabric@${version}" dist.integrity 2>/dev/null)"; then
            if [ "${published_integrity}" != "${integrity}" ]; then
              echo "::error::npm already contains @singleaxis/fabric@${version} with different bytes"
              exit 1
            fi
            echo "@singleaxis/fabric@${version} already contains the qualified bytes; nothing to republish."
          else
            npm publish "${package}" --access public --tag beta --provenance
          fi

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      [
        changelog,
        package-fabricctl,
        publish-image,
        publish-chart,
        publish-pypi,
        publish-npm,
      ]
    permissions:
      contents: write       # softprops/action-gh-release creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chart-package
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-qualification
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-python-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-typescript-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-contracts
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fabricctl-release
          path: dist
      - name: Verify qualified contract artifact handoff
        working-directory: dist
        run: sha256sum --check SHA256SUMS.contracts
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.notes }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: dist/*
          fail_on_unmatched_files: true
