name: Action record (AR-1)

# Spec 056 §6.2 AR-1, the agent action reconstruction acceptance scenario:
# milestone M1 against a local-profile Node (hermetic, live) and M2 against a
# production-profile Node (production-replay, production-live,
# production-auditd). Not one of the release-required workflows: Fabric makes
# no action reconstruction claim until this is green.
#
# - hermetic: the agent, the exec.subprocess hook, a natively built Node and
#   the verifier run for real; the host chain is a recorded host-sensor event
#   file bound to the run (qualification/action-record/ar1/replay.py).
# - live: the same with the eBPF host emitter scoped to the agent's cgroup;
#   when the eBPF programs cannot load on the hosted runner, the auditd
#   receiver with uid-scoped rules (spec 056 §6.2, OD-6). Needs sudo.
# - production-replay: the agent in node mode against the native Node with
#   static ingress groups (agent, ebpf, a quiet ebpf node), TLS and tokens;
#   the host side staged through the host-records library by the test-only
#   hostrecords-replay command (built here with Go, never by an image).
# - production-live: the Compose production Node with the host-ingress
#   overlay, the eBPF emitter in production mode on the runner's kernel, the
#   agent in a container under fabric-agents.slice, a real docker run under
#   fabric-sandboxes.slice and bwrap --unshare-pid. Docker on the systemd
#   cgroup driver; sudo.
# - production-auditd: deploy/compose/qualify-sensor-auditd.sh (WP4-09): the
#   auditd sensor collector through its own group, on a fixture audit.log.
#
# Passive by construction: the sensors are tracepoints and audit rules, the
# hook only observes; nothing here evaluates, blocks or alters the agent.

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "components/otel-collector-fabric/**"
      - "components/host-emitter/**"
      - "contracts/**"
      - "qualification/action-record/**"
      - "qualification/remote-sandbox/**"
      - "deploy/compose/**"
      - ".github/workflows/action-record.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "components/otel-collector-fabric/**"
      - "components/host-emitter/**"
      - "contracts/**"
      - "qualification/action-record/**"
      - "qualification/remote-sandbox/**"
      - "deploy/compose/**"
      - ".github/workflows/action-record.yml"
  workflow_dispatch:

concurrency:
  group: action-record-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hermetic:
    name: AR-1 hermetic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: components/otel-collector-fabric/**/go.sum
      - name: Build the Fabric Node (fabric-gate and otelcol-fabric)
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.164.0
          make -C components/otel-collector-fabric build OCB="$(go env GOPATH)/bin/builder"
      - uses: ./.github/actions/setup-uv
      - name: Install the SDK and the harness dependencies
        # sdk/python/uv.lock with pip --require-hashes; the dev group carries the
        # harness tools (pytest, jsonschema, PyYAML, httpx, openai, ruff, mypy).
        run: |
          scripts/ci/install-python-locked.sh --extra otlp --extra hooks-sandbox-e2b --group dev --group ci
          python -m pip install --no-deps --no-build-isolation -e sdk/python
      - name: Lint and type-check the harness
        working-directory: qualification/action-record
        env:
          MYPYPATH: ../remote-sandbox # the fixture E2B service the production harness runs
        run: |
          ruff check .
          ruff format --check .
          mypy --strict --config-file ../../sdk/python/pyproject.toml ar1 run_ar1.py tests
      - name: Harness unit tests
        # The end-to-end tests are run_ar1.py runs (this job's next step, and the
        # production-replay job); deselect them by node id (a -k on a name also matches
        # its module and deselects everything).
        run: >-
          python -m pytest qualification/action-record/tests -q -p no:cacheprovider
          --deselect qualification/action-record/tests/test_ar1_hermetic.py::test_ar1_hermetic
          --deselect
          qualification/action-record/tests/test_ar1_production_replay.py::test_ar1_production_replay
      - name: AR-1 hermetic
        run: |
          python qualification/action-record/run_ar1.py --mode hermetic --node required \
            --out "${RUNNER_TEMP}/ar1-hermetic"
      - name: Upload the AR-1 record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ar1-hermetic-${{ matrix.os }}
          path: ${{ runner.temp }}/ar1-hermetic
          if-no-files-found: ignore
          retention-days: 14

  live:
    name: AR-1 live (Linux host sensor)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: |
            components/otel-collector-fabric/**/go.sum
            components/host-emitter/go.sum
      - name: Install system packages (BPF toolchain, bubblewrap, auditd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev bubblewrap auditd
          # Ubuntu 24.04 confines unprivileged user namespaces; bubblewrap needs them
          # for the step 4 child-process sandbox (the harness falls back to python -I).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build the Fabric Node (fabric-gate and otelcol-fabric)
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.164.0
          make -C components/otel-collector-fabric build OCB="$(go env GOPATH)/bin/builder"
      - name: Build the eBPF host emitter
        # A failed BPF build is not fatal: the harness then uses auditd (OD-6).
        continue-on-error: true
        working-directory: components/host-emitter
        run: |
          go generate ./...
          CGO_ENABLED=0 go build -trimpath -o fabric-host-emitter .
      - uses: ./.github/actions/setup-uv
      - name: Install the SDK and the harness dependencies
        # sdk/python/uv.lock with pip --require-hashes (dev group: the harness tools).
        run: |
          scripts/ci/install-python-locked.sh --extra otlp --group dev --group ci
          python -m pip install --no-deps --no-build-isolation -e sdk/python
      - name: Let the auditd scope user read the checkout
        # Only the auditd fallback runs the agent as another user (fabricar1).
        run: |
          chmod o+x "${HOME}" "${HOME}/work" "$(dirname "${GITHUB_WORKSPACE}")"
          chmod -R o+rX "${GITHUB_WORKSPACE}"
          mkdir -p "${RUNNER_TEMP}/ar1-live" && chmod o+x "${RUNNER_TEMP}"
      - name: AR-1 live
        run: |
          python qualification/action-record/run_ar1.py --mode live \
            --out "${RUNNER_TEMP}/ar1-live"
      - name: Make the AR-1 record readable for upload
        # The eBPF emitter runs as root and leaves its spool root-owned (0700).
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/ar1-live" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/ar1-live"
            chmod -R a+rX "${RUNNER_TEMP}/ar1-live"
          fi
      - name: Upload the AR-1 record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ar1-live
          path: ${{ runner.temp }}/ar1-live
          if-no-files-found: ignore
          retention-days: 14

  production-replay:
    name: AR-1 production replay (${{ matrix.os }})
    # Spec 056 §6.2 "Hermetic production replay": the gate, admission, delivery and
    # reader path of a production-profile Node, not the emitter.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Also builds the replay command (go build in hostrecords).
          go-version: "1.26"
          cache-dependency-path: components/otel-collector-fabric/**/go.sum
      - name: Build the Fabric Node (fabric-gate and otelcol-fabric)
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.164.0
          make -C components/otel-collector-fabric build OCB="$(go env GOPATH)/bin/builder"
      - uses: ./.github/actions/setup-uv
      - name: Install the SDK and the harness dependencies
        # sdk/python/uv.lock with pip --require-hashes; the dev group carries the
        # harness tools (pytest, jsonschema, PyYAML, httpx, openai, ruff, mypy).
        run: |
          scripts/ci/install-python-locked.sh --extra otlp --extra hooks-sandbox-e2b --group dev --group ci
          python -m pip install --no-deps --no-build-isolation -e sdk/python
      - name: AR-1 production replay
        run: |
          python qualification/action-record/run_ar1.py --profile production --mode replay \
            --out "${RUNNER_TEMP}/ar1-production-replay"
      - name: Make the AR-1 record readable for upload
        # The run's throwaway TLS keys, tokens and id key stay on the runner.
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/ar1-production-replay" ]; then
            rm -rf "${RUNNER_TEMP}/ar1-production-replay/secrets"
            chmod -R a+rX "${RUNNER_TEMP}/ar1-production-replay"
          fi
      - name: Upload the AR-1 record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ar1-production-replay-${{ matrix.os }}
          path: ${{ runner.temp }}/ar1-production-replay
          if-no-files-found: ignore
          retention-days: 14

  production-live:
    name: AR-1 production live (eBPF, production-profile Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: components/host-emitter/go.sum
      - name: Install system packages (BPF toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev jq
      - name: Docker on the systemd cgroup driver (cgroup v2)
        # Spec 056 §6.2: the harness asserts the driver and fails, never skips.
        run: |
          if [ "$(docker info --format '{{.CgroupDriver}}')" != systemd ]; then
            config=/etc/docker/daemon.json
            current='{}'
            if sudo test -s "$config"; then current="$(sudo cat "$config")"; fi
            printf '%s' "$current" \
              | jq '. + {"exec-opts": ["native.cgroupdriver=systemd"]}' \
              | sudo tee "$config" >/dev/null
            sudo systemctl restart docker
          fi
          docker info --format '{{.CgroupDriver}} cgroup v{{.CgroupVersion}}'
      - name: Build the eBPF host emitter
        working-directory: components/host-emitter
        run: |
          go generate ./...
          CGO_ENABLED=0 go build -trimpath -o fabric-host-emitter .
      - uses: ./.github/actions/setup-uv
      - name: Install the SDK and the harness dependencies
        # sdk/python/uv.lock with pip --require-hashes; the dev group carries the
        # harness tools (pytest, jsonschema, PyYAML, httpx, openai, ruff, mypy).
        run: |
          scripts/ci/install-python-locked.sh --extra otlp --extra hooks-sandbox-e2b --group dev --group ci
          python -m pip install --no-deps --no-build-isolation -e sdk/python
      - name: Build the Fabric Node image (once, for every variant's Compose project)
        run: docker build -q -t fabric/node:ar1-production components/otel-collector-fabric
      - name: AR-1 production live
        env:
          AR1_NODE_IMAGE: fabric/node:ar1-production
        run: |
          python qualification/action-record/run_ar1.py --profile production --mode live \
            --out "${RUNNER_TEMP}/ar1-production-live"
      - name: Make the AR-1 record readable for upload
        # The emitter and the agent's container leave root-owned files; the run's
        # throwaway TLS keys, tokens and id key stay on the runner.
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/ar1-production-live" ]; then
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/ar1-production-live"
            sudo find "${RUNNER_TEMP}/ar1-production-live" \
              \( -name secrets -o -name node-secrets -o -name sensor-keys \) -prune \
              -exec rm -rf {} +
            chmod -R a+rX "${RUNNER_TEMP}/ar1-production-live"
          fi
      - name: Upload the AR-1 record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ar1-production-live
          path: ${{ runner.temp }}/ar1-production-live
          if-no-files-found: ignore
          retention-days: 14

  production-auditd:
    name: AR-1 production auditd sensor collector
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify the auditd sensor collector through its group
        run: bash deploy/compose/qualify-sensor-auditd.sh
