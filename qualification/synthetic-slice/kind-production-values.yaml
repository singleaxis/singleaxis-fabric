# Disposable kind qualification ONLY. This is layered over shadow-production.
# The controlled sink acknowledges only after fsync. kind does not qualify
# encrypted customer storage or NetworkPolicy enforcement by a production CNI.
namespace:
  create: false

otel-collector:
  replicaCount: 1
  image:
    repository: docker.io/library/fabric-otelcol
    # Supplied from the actual manifest imported into kind; never Docker .Id.
    tag: ""
    digest: ""
    pullPolicy: Never
  # Spec 049 §7.9: the production ingress is bound to one tenant and source.
  # The custom-agent smoke (scripts/qualification/run_custom_agent_smoke.py)
  # is an explicit-line recorder that runs without FABRIC_WIRE_ID_KEY and so
  # emits its ids as given: tenant `synthetic`, source `dispatcher`. Clear
  # capture labels are the Node counterpart; the labels are synthetic and
  # hold no personal data.
  fabric:
    guard:
      captureLabels: clear
  receiver:
    workloadAuthentication:
      tenantId: synthetic
      workloadId: synthetic-pilot-client
      sourceId: dispatcher
      identityAttestationRef: synthetic-fixture-credential-review-only
      tokenSecret:
        name: fabric-workload-token
        key: token
  exporter:
    endpoint: https://fabric-test-sink:8443
    tls:
      caSecret:
        name: fabric-test-sink-ca
        key: ca.crt
    sendingQueue:
      persistence:
        size: 1Gi
        storageClass: standard
        # Explicitly unqualified: kind local-path storage is not encrypted
        # customer storage. This review reference records that fixture gap.
        encryptionAttestationRef: synthetic-unencrypted-storage-NO_GO
  networkPolicy:
    ingressFrom:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: otel-collector
    exporterEgress:
      to:
        - podSelector:
            matchLabels:
              app: fabric-test-sink
      ports:
        - protocol: TCP
          port: 8443
