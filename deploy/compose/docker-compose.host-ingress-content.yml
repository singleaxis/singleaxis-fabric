# The agent group's content path (spec 048; spec 053 §6.1 rules 4 and 9), with
# docker-compose.host-ingress.yml: content ingress on 4319 with the agent
# group's token, the sealed content queue and the S3 content exporter.
# `make up-prod-groups` adds it when FABRIC_CONTENT_BACKEND=s3; the groups
# profile has no file backend.

secrets:
  fabric_content_key:
    file: ${FABRIC_CONTENT_KEY_FILE:?set FABRIC_CONTENT_KEY_FILE in .env to the Node content key file (spec 049 §7.8)}

volumes:
  fabric-content-queue:

services:
  fabric-node:
    command:
      - --config=/etc/fabric-node/collector-production-groups.yaml
      - --config=/etc/fabric-node/collector-production-groups-content.yaml
    environment:
      FABRIC_CONTENT_S3_BUCKET: ${FABRIC_CONTENT_S3_BUCKET:?set FABRIC_CONTENT_S3_BUCKET in .env}
      FABRIC_CONTENT_S3_PREFIX: ${FABRIC_CONTENT_S3_PREFIX:-fabric/content/}
      FABRIC_CONTENT_S3_REGION: ${FABRIC_CONTENT_S3_REGION:?set FABRIC_CONTENT_S3_REGION in .env to the bucket region}
      FABRIC_CONTENT_S3_ENDPOINT: ${FABRIC_CONTENT_S3_ENDPOINT:-}
      FABRIC_CONTENT_S3_PATH_STYLE: ${FABRIC_CONTENT_S3_PATH_STYLE:-false}
      FABRIC_CONTENT_S3_SSE: ${FABRIC_CONTENT_S3_SSE:-aws:kms}
      FABRIC_CONTENT_S3_KMS_KEY_ID: ${FABRIC_CONTENT_S3_KMS_KEY_ID:-}
    secrets:
      - fabric_ingress_token
      - fabric_ebpf_token
      - fabric_content_key
    volumes:
      - fabric-content-queue:/var/lib/fabric-node/content-queue
    ports:
      - "${FABRIC_BIND_ADDR:-127.0.0.1}:${FABRIC_OTLP_CONTENT_PORT:-4319}:4319"
    # memory_limiter is 1536 MiB with content (64 MiB bodies).
    mem_limit: 2g
