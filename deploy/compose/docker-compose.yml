name: fabric-node-evaluation

networks:
  fabric-node:
    driver: bridge

volumes:
  fabric-queue:
  sink-data:

services:
  # Controlled evaluation destination. It returns 200 only after writing and
  # fsyncing the received request. That is a property of this test sink, not a
  # persistence guarantee Fabric can infer from arbitrary OTLP destinations.
  test-sink:
    # Pinned by digest so the evaluation harness is reproducible. Resolve a
    # newer digest with:
    #   docker buildx imagetools inspect python:3.12-alpine
    image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
    command: ["python", "/app/otlp_sink.py"]
    environment:
      SINK_DATA_DIR: /var/lib/fabric-test-sink
      SINK_PORT: "8080"
    volumes:
      - ./sink/otlp_sink.py:/app/otlp_sink.py:ro
      - sink-data:/var/lib/fabric-test-sink
    ports:
      # Loopback-only: the /contains endpoint is a telemetry-search oracle and
      # must never be reachable off-host.
      - "127.0.0.1:${FABRIC_SINK_PORT:-8080}:8080"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [fabric-node]

  # Fabric Node v1 is one customer-facing service. The custom Collector is its
  # current implementation: receive -> allowlist -> persistent queue -> OTLP.
  fabric-node:
    build:
      context: ../../components/otel-collector-fabric
      dockerfile: Dockerfile
    image: ${FABRIC_NODE_IMAGE:-fabric/node:evaluation}
    command: ["--config=/etc/fabric-node/collector.yaml"]
    volumes:
      - ./collector-config/collector.yaml:/etc/fabric-node/collector.yaml:ro
      - fabric-queue:/var/lib/fabric-node/queue
    ports:
      # Evaluation stays on loopback: it is plaintext and unauthenticated.
      # Cross-host ingress requires the separately reviewed secure profile.
      - "127.0.0.1:${FABRIC_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${FABRIC_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${FABRIC_HEALTH_PORT:-13133}:13133"
    depends_on:
      test-sink:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [fabric-node]
