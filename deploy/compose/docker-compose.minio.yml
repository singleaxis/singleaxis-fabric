# EVALUATION overlay: the Fabric Node writes content to a local MinIO bucket
# with server-side encryption, the way it writes to S3 in production
# (spec 048). Not a production MinIO deployment.
#
#   make up-minio
#   # = docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d --build --wait
#
# What it proves: agent -> Node (4319) -> fabriccontent (s3 backend,
# path-style endpoint, SSE AES256, If-None-Match writes) -> MinIO, and
# `fabric.reconstruct --store-uri s3://fabric-content/fabric/content/
#  --s3-endpoint-url http://127.0.0.1:9000 --s3-path-style` reading it back.
#
# Credentials (all overridable, evaluation-only defaults):
#   * MinIO root: used only by the minio-init job.
#   * Node writer (FABRIC_MINIO_NODE_*): s3:PutObject + s3:GetObject on the
#     content prefix. Only the fabric-node service receives these keys; the
#     agent receives none.
#   * Reader (FABRIC_MINIO_READER_*): s3:GetObject on the content prefix, for
#     running fabric.reconstruct on the host.
# MinIO publishes on 127.0.0.1 only, never on FABRIC_BIND_ADDR.

x-minio-image: &minio-image
  # Pinned by digest (multi-arch index). Resolve a newer one with:
  #   docker buildx imagetools inspect quay.io/minio/minio:<RELEASE tag>
  image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

volumes:
  minio-data:

services:
  minio:
    <<: *minio-image
    command: ["server", "/data", "--address", ":9000", "--console-address", "127.0.0.1:9001"]
    environment:
      MINIO_ROOT_USER: ${FABRIC_MINIO_ROOT_USER:-fabric-eval-root}
      MINIO_ROOT_PASSWORD: ${FABRIC_MINIO_ROOT_PASSWORD:-fabric-eval-root-password}
      # Single static key for SSE-S3 (<name>:<base64 of 32 bytes>). Public,
      # evaluation-only default; set your own value to test key handling.
      MINIO_KMS_SECRET_KEY: ${FABRIC_MINIO_KMS_SECRET_KEY:-fabric-eval-key:BaY/1nH8gHvn+gXG4Ve1xElVwbIGLUemSgAh+sMK5UA=}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${FABRIC_MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    networks: [fabric-node]

  # One-shot: bucket with default SSE-S3, a writer policy for the Node and a
  # read-only policy for reconstruction, both scoped to the content prefix.
  minio-init:
    <<: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MINIO_ROOT_USER: ${FABRIC_MINIO_ROOT_USER:-fabric-eval-root}
      MINIO_ROOT_PASSWORD: ${FABRIC_MINIO_ROOT_PASSWORD:-fabric-eval-root-password}
      BUCKET: ${FABRIC_MINIO_BUCKET:-fabric-content}
      PREFIX: fabric/content/
      NODE_KEY: ${FABRIC_MINIO_NODE_ACCESS_KEY:-fabric-node-writer}
      NODE_SECRET: ${FABRIC_MINIO_NODE_SECRET_KEY:-fabric-node-writer-secret}
      READER_KEY: ${FABRIC_MINIO_READER_ACCESS_KEY:-fabric-reader}
      READER_SECRET: ${FABRIC_MINIO_READER_SECRET_KEY:-fabric-reader-secret}
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$BUCKET"
        mc encrypt set sse-s3 "local/$$BUCKET"
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject"],"Resource":["arn:aws:s3:::%s/%s*"]}]}' "$$BUCKET" "$$PREFIX" > /tmp/fabric-node-writer.json
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/%s*"]}]}' "$$BUCKET" "$$PREFIX" > /tmp/fabric-reader.json
        mc admin policy create local fabric-node-writer /tmp/fabric-node-writer.json
        mc admin policy create local fabric-reader /tmp/fabric-reader.json
        mc admin user add local "$$NODE_KEY" "$$NODE_SECRET"
        mc admin user add local "$$READER_KEY" "$$READER_SECRET"
        # Re-attaching an attached policy succeeds on this MinIO release, so
        # the job is idempotent across `up` runs.
        mc admin policy attach local fabric-node-writer --user "$$NODE_KEY"
        mc admin policy attach local fabric-reader --user "$$READER_KEY"
        echo "minio-init: bucket $$BUCKET ready (SSE-S3, writer + reader policies)"
    restart: "no"
    networks: [fabric-node]

  fabric-node:
    command:
      - --config=/etc/fabric-node/collector.yaml
      - --config=/etc/fabric-node/collector-content-s3.yaml
    environment:
      FABRIC_CONTENT_S3_BUCKET: ${FABRIC_MINIO_BUCKET:-fabric-content}
      FABRIC_CONTENT_S3_PREFIX: fabric/content/
      FABRIC_CONTENT_S3_REGION: us-east-1
      FABRIC_CONTENT_S3_ENDPOINT: http://minio:9000
      FABRIC_CONTENT_S3_PATH_STYLE: "true"
      FABRIC_CONTENT_S3_SSE: AES256
      FABRIC_CONTENT_S3_KMS_KEY_ID: ""
      # Static writer keys for the Node only (read by the AWS default chain).
      AWS_ACCESS_KEY_ID: ${FABRIC_MINIO_NODE_ACCESS_KEY:-fabric-node-writer}
      AWS_SECRET_ACCESS_KEY: ${FABRIC_MINIO_NODE_SECRET_KEY:-fabric-node-writer-secret}
    volumes:
      - ./collector-config/collector-content-s3.yaml:/etc/fabric-node/collector-content-s3.yaml:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
