# The auditd group (spec 053 §6.2.6, §6.2.8; spec 056 §7.3.3 (h)), merged after
# collector-production-groups.yaml when FABRIC_AUDITD_TOKEN_FILE is set
# (docker-compose.host-ingress-auditd.yml). The auditd sensor collector
# (docker-compose.sensor-auditd.yml) exports host records to it with
# otlp_http, so this group listens on OTLP/HTTP 4428 with its own token,
# source (FABRIC_AUDITD_SOURCE_ID) and guard. The audit receiver itself never
# runs in the Node (spec 053 §6.2.6 rule 4).
#
# Maps merge and lists replace: service.extensions is the base list plus this
# group's authenticator (collector-production-groups-auditd-content.yaml holds
# the list for auditd with content).

extensions:
  bearertokenauth/auditd:
    filename: /run/secrets/fabric_auditd_token
    require_single_token: true

receivers:
  otlp/auditd:
    protocols:
      http:
        endpoint: 0.0.0.0:4428
        auth:
          authenticator: bearertokenauth/auditd
        read_header_timeout: 5s
        read_timeout: 30s
        idle_timeout: 120s
        max_request_body_size: 8388608 # 8 MiB
        tls:
          cert_file: ${env:FABRIC_INGRESS_TLS_CERT_FILE:-/run/fabric-node/tls/server.crt}
          key_file: ${env:FABRIC_INGRESS_TLS_KEY_FILE:-/run/fabric-node/tls/server.key}
          min_version: "1.3"

processors:
  fabricguard/auditd:
    event_class_attribute: event_class
    drop_unknown_classes: true
    max_field_bytes: 8192
    capture_labels: pseudonymous
    identity_mode: pseudonymous
    profile: production
    source_kind: host.auditd
    host_digests: omitted
    evidence_source_binding:
      tenant_id: ${env:FABRIC_TENANT_ID}
      source_id: ${env:FABRIC_AUDITD_SOURCE_ID}

service:
  extensions: [health_check, noredirect, file_storage/fabric, bearertokenauth/agent, bearertokenauth/ebpf, bearertokenauth/auditd]
  pipelines:
    traces/auditd:
      receivers: [otlp/auditd]
      processors: [memory_limiter, fabricguard/auditd]
      exporters: [otlp_http/fabric]
