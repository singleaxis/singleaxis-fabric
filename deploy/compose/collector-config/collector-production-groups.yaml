# Fabric Node client-VM production configuration with static dedicated ingress
# groups (spec 053 §6.1, §6.2.6; spec 056 §7.3.3 (f), (h)).
#
# `make up-prod-groups` runs this file in place of collector-production.yaml
# (docker-compose.host-ingress.yml). Every source the Node serves is one group,
# bound to exactly one (tenant, source, kind) by its own bearer token, its own
# listener and its own fabricguard/<group> instance, so a batch's identity is
# the ingress it arrived on, never a source it names:
#
#   group  kind       listener                     token (Compose secret)
#   agent  agent      gRPC 4317, HTTP 4318          FABRIC_INGRESS_TOKEN_FILE
#   ebpf   host.ebpf  gRPC 4417 (the emitter's      FABRIC_EBPF_TOKEN_FILE
#                     own OTLP client is gRPC)
#
# collector-production-groups-auditd.yaml adds the auditd group (OTLP/HTTP 4428,
# because the sensor collector exports with otlp_http) and
# collector-production-groups-content.yaml the agent group's content path.
# The source ids are the ids as they travel: FABRIC_AGENT_SOURCE_ID (the
# agents' s- pseudonym) and FABRIC_EBPF_SOURCE_ID (`fabric-host-emitter
# print-source-id` for the emitter's EMIT_SOURCE_LABEL). preflight-prod.sh
# --groups refuses equal token bytes across groups and an unset or repeated
# source id; fabric-gate checks every group rule again at start.
#
# Unlike collector-production.yaml, receiver TLS is required here: a group
# listener uses TLS (spec 053 §6.1 rule 8). Put the certificate and key in
# FABRIC_INGRESS_TLS_DIR (default ./tls) before the first start.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Destination response policy. Every otlp_http exporter lists it
  # (fabric-gate refuses one that does not). Spec 048 H1: a 3xx from the
  # destination is a retryable failure, so the batch and its Authorization
  # header are never re-sent to another location and a redirect to a login
  # page is never a successful export. A credential, availability or
  # configuration failure (401, 403, 404, 500, ...) is retried, never
  # dropped, while the persistent queue has room. A permanent rejection
  # (400, 409, 413, 422) is released only after a destination_rejected loss
  # record for each of its source positions is in the loss outbox, which
  # delivers it once the destination accepts again. The outbox lives on the
  # queue volume; fabric_delivery_loss_records_pending > 0 means some are
  # still waiting.
  noredirect:
    loss_outbox:
      directory: /var/lib/fabric-node/queue/loss-outbox
  file_storage/fabric:
    directory: /var/lib/fabric-node/queue
    timeout: 1s
    create_directory: true
    fsync: true
    compaction:
      directory: /var/lib/fabric-node/queue
      on_start: true
      on_rebound: true
  # Each group's one credential, used only by its own receiver. Exactly one
  # 32-4096-byte printable ASCII token per file, without a trailing newline.
  bearertokenauth/agent:
    filename: /run/secrets/fabric_ingress_token
    require_single_token: true
  bearertokenauth/ebpf:
    filename: /run/secrets/fabric_ebpf_token
    require_single_token: true

receivers:
  otlp/agent:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth/agent
        max_recv_msg_size_mib: 8
        max_concurrent_streams: 64
        keepalive:
          enforcement_policy:
            min_time: 10s
            permit_without_stream: false
        tls:
          cert_file: ${env:FABRIC_INGRESS_TLS_CERT_FILE:-/run/fabric-node/tls/server.crt}
          key_file: ${env:FABRIC_INGRESS_TLS_KEY_FILE:-/run/fabric-node/tls/server.key}
          min_version: "1.3"
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/agent
        read_header_timeout: 5s
        read_timeout: 30s
        idle_timeout: 120s
        max_request_body_size: 8388608 # 8 MiB
        tls:
          cert_file: ${env:FABRIC_INGRESS_TLS_CERT_FILE:-/run/fabric-node/tls/server.crt}
          key_file: ${env:FABRIC_INGRESS_TLS_KEY_FILE:-/run/fabric-node/tls/server.key}
          min_version: "1.3"
  otlp/ebpf:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4417
        auth:
          authenticator: bearertokenauth/ebpf
        max_recv_msg_size_mib: 8
        max_concurrent_streams: 64
        keepalive:
          enforcement_policy:
            min_time: 10s
            permit_without_stream: false
        tls:
          cert_file: ${env:FABRIC_INGRESS_TLS_CERT_FILE:-/run/fabric-node/tls/server.crt}
          key_file: ${env:FABRIC_INGRESS_TLS_KEY_FILE:-/run/fabric-node/tls/server.key}
          min_version: "1.3"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  fabricguard/agent:
    event_class_attribute: event_class
    drop_unknown_classes: true
    max_field_bytes: 8192
    capture_labels: pseudonymous
    identity_mode: pseudonymous
    profile: production
    source_kind: agent
    evidence_source_binding:
      tenant_id: ${env:FABRIC_TENANT_ID}
      source_id: ${env:FABRIC_AGENT_SOURCE_ID}
  # Spec 053 §6.2.7: a host group admits only host records and their markers,
  # refuses a batch naming another source, and stamps the rest authenticated.
  fabricguard/ebpf:
    event_class_attribute: event_class
    drop_unknown_classes: true
    max_field_bytes: 8192
    capture_labels: pseudonymous
    identity_mode: pseudonymous
    profile: production
    source_kind: host.ebpf
    # Executable, argv and path digests need this and the emitter's
    # EMIT_DIGESTS=permitted (spec 053 §6.2.5).
    host_digests: omitted
    evidence_source_binding:
      tenant_id: ${env:FABRIC_TENANT_ID}
      source_id: ${env:FABRIC_EBPF_SOURCE_ID}

exporters:
  otlp_http/fabric:
    # Customer-selected https:// OTLP/HTTP destination, shared by every group
    # after its guard has stamped it (spec 053 §6.1 rule 9).
    endpoint: ${env:FABRIC_EXPORT_ENDPOINT}
    headers:
      Authorization: ${env:FABRIC_EXPORT_AUTH_HEADER}
    timeout: 10s
    middlewares:
      - id: noredirect
    tls:
      insecure: false
      insecure_skip_verify: false
      # For a private CA, drop the CA bundle into FABRIC_INGRESS_TLS_DIR and
      # uncomment:
      # ca_file: ${env:FABRIC_EXPORT_CA_FILE:-/run/fabric-node/tls/ca.crt}
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      block_on_overflow: true
      storage: file_storage/fabric
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions: [health_check, noredirect, file_storage/fabric, bearertokenauth/agent, bearertokenauth/ebpf]
  pipelines:
    traces/agent:
      receivers: [otlp/agent]
      processors: [memory_limiter, fabricguard/agent]
      exporters: [otlp_http/fabric]
    logs/agent:
      receivers: [otlp/agent]
      processors: [memory_limiter, fabricguard/agent]
      exporters: [otlp_http/fabric]
    # A host group has only its traces pipeline (spec 053 §6.2.6 rule 1).
    traces/ebpf:
      receivers: [otlp/ebpf]
      processors: [memory_limiter, fabricguard/ebpf]
      exporters: [otlp_http/fabric]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
