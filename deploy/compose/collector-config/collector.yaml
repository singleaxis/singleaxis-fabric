# Fabric Node local evaluation configuration.
# This profile is plaintext and unauthenticated; use the Helm
# shadow-production profile across a customer trust boundary.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/fabric:
    directory: /var/lib/fabric-node/queue
    timeout: 1s
    create_directory: true
    fsync: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  fabricguard:
    event_class_attribute: event_class
    drop_unknown_classes: true
    max_field_bytes: 8192

exporters:
  otlp_http/test_sink:
    endpoint: http://test-sink:8080
    timeout: 5s
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      block_on_overflow: true
      storage: file_storage/fabric
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 0s

service:
  extensions: [health_check, file_storage/fabric]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, fabricguard]
      exporters: [otlp_http/test_sink]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, fabricguard]
      exporters: [otlp_http/test_sink]
  telemetry:
    logs:
      level: info
