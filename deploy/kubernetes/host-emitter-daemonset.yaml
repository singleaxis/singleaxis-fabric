# fabric-host-emitter DaemonSet (spec 031) — passive eBPF host observation.
#
# This is the ONLY Fabric workload that requests elevated capability, and it
# stays read-only: the BPF programs are tracepoints (observe), never LSM or
# packet-control hooks (enforce).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fabric-host-emitter
  namespace: fabric-system
  labels:
    app.kubernetes.io/name: fabric-host-emitter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-host-emitter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-host-emitter
    spec:
      hostPID: true            # correlate kernel events to host process tree
      hostNetwork: false
      containers:
        - name: emitter
          image: ghcr.io/singleaxis/fabric-host-emitter:0.8.0-rc.1
          imagePullPolicy: IfNotPresent
          env:
            - name: EMIT_ENDPOINT
              value: "fabric-collector.fabric-system.svc.cluster.local:4317"
            # Scope to the agent workload's cgroup; never silently all-host.
            - name: EMIT_CGROUP_PATH
              value: ""        # e.g. /sys/fs/cgroup/kubepods/.../<agent-pod>
            - name: EMIT_ALL_HOST
              value: "false"
            - name: EMIT_EXEC
              value: "true"
            - name: EMIT_CONNECT
              value: "true"
            - name: EMIT_FILE_ACCESS
              value: "false"   # high volume — enable only when scoped
            - name: EMIT_MAX_EVENTS_PER_SEC
              value: "500"
            # Bearer token for the node's bearertokenauth ingress:
            # - name: EMIT_BEARER_TOKEN_FILE
            #   value: /var/run/secrets/fabric/emitter-token
          securityContext:
            runAsUser: 0        # bpf() and tracefs access need root
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add:
                - BPF          # load/tracepoint programs (kernel >=5.8)
                - PERFMON      # perf_event_open for tracepoint attach
                - SYS_RESOURCE # RLIMIT_MEMLOCK bump
                - DAC_READ_SEARCH  # read /sys/kernel/btf + cgroupfs
            # seccomp must permit bpf(), perf_event_open(), rlimit syscalls.
          volumeMounts:
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: cgroupfs
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
      volumes:
        - name: btf
          hostPath: { path: /sys/kernel/btf, type: Directory }
        - name: cgroupfs
          hostPath: { path: /sys/fs/cgroup, type: Directory }
        - name: tracefs
          hostPath: { path: /sys/kernel/tracing, type: Directory }
        - name: debugfs
          hostPath: { path: /sys/kernel/debug, type: Directory }
      tolerations:
        - operator: Exists      # observe every node, incl. control plane
      # On kernels <5.8 or without BTF the container crashes with a clear
      # startup error — no partial silent operation.
