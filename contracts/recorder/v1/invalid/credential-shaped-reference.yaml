# Schema-valid but CLI-invalid: the reference pattern admits opaque tokens,
# while the release validator rejects credential-shaped values such as AWS
# access key IDs, bearer tokens, API keys, GitHub tokens, and JWTs.
apiVersion: fabric.singleaxis.dev/v1alpha1
kind: FabricRecorder
metadata:
  name: healthcare-shadow
spec:
  identity:
    recorderId: healthcare-shadow
    systemId: system/ambient-clinical-assistant
    deploymentId: deployment/production-v1
  input:
    method: otlp
  content:
    mode: metadata
  protect:
    privacyPolicyRef: privacy/metadata-only-v1
    configDigest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  destination:
    ref: AKIAIOSFODNN7EXAMPLE
  installation:
    ref: installation/healthcare-shadow
