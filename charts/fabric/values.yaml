# Fabric Node is the OSS passive recorder: CAPTURE -> PROTECT -> DELIVER.
# It is not an inline control, evaluation, red-team, or governance runtime.

tenant:
  # Required by shadow-production; optional for local evaluation.
  id: ""
  name: ""

# NOTE: there is no parent-level imagePullSecrets key — it would not reach
# the Collector pod. Set otel-collector.imagePullSecrets instead.

global:
  fabric:
    version: "0.8.0-rc.1"

namespace:
  create: false
  name: fabric-system
  annotations: {}
  labels: {}

# shadow-production pins this on. The Collector subchart then opens only the
# explicitly configured receiver and destination paths.
networkPolicy:
  denyDefault: false

# Fabric Node v1 packages only the Fabric Collector.
otelCollector:
  enabled: true

# Collector settings live under the dependency name. Bare defaults are for
# local evaluation only: without a destination records go to debug stdout.
# Install profiles/shadow-production.yaml for the fail-closed posture.
otel-collector: {}

profile:
  name: shadow-dev
