{{- /*
With networkPolicy.denyDefault, the hook Jobs of spec 058 §10.2 (the secrets
Job and the webhook caBundle Job) may reach the Kubernetes API server and
nothing else. A hook itself, so it exists before the Jobs run on an upgrade
(the deny-default policy is already in place then). The API server's
addresses come from secretsJob.apiServer, else from the cluster at install;
an offline render that cannot read them opens TCP 443 and 6443 to any address
for these Job pods only (set secretsJob.apiServer to narrow it).
*/ -}}
{{- $plan := include "fabric.secretsPlan" . | fromYaml -}}
{{- if and $plan.render .Values.networkPolicy.denyDefault }}
{{- $api := include "otel-collector.apiServerEgress" (dict "Values" (dict "networkPolicy" (dict "hostSensorEgress" (dict "apiServer" .Values.secretsJob.apiServer)))) | fromYaml }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fabric.objectName" (dict "root" . "suffix" "fabric-secrets-egress") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fabric.componentLabels" (dict "root" . "component" "secrets-job") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: secrets-job
  policyTypes:
    - Egress
  egress:
    {{- if $api.to }}
    - to:
        {{- toYaml $api.to | nindent 8 }}
      ports:
        {{- toYaml $api.ports | nindent 8 }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
{{- end }}
