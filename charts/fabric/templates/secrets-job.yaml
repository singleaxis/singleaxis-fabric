{{- /*
Spec 058 §10.2: generated Secrets without hand work. A pre-install and
pre-upgrade hook Job runs the Fabric CLI image (`fabric init --kubernetes
--in-cluster`): it creates each missing Secret and never overwrites, prints or
logs one. The values exist only in the cluster, never in the Helm release
(hooks are not part of the release manifest, and this Job's manifest holds no
secret). Its ServiceAccount may only get the Secrets it manages and create
Secrets, in the release namespace and the listed agent namespaces; the RBAC
objects are deleted when the Job succeeds.
*/ -}}
{{- $plan := include "fabric.secretsPlan" . | fromYaml -}}
{{- if $plan.render }}
{{- $name := include "fabric.objectName" (dict "root" . "suffix" "fabric-secrets") }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fabric.componentLabels" (dict "root" . "component" "secrets-job") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hook) | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fabric.componentLabels" (dict "root" . "component" "secrets-job") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hook) | nindent 4 }}
rules:
  # get is limited to the Secrets this Job manages; Kubernetes cannot limit
  # create by name.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ include "fabric.secretsReleaseNames" . | fromYamlArray | toJson }}
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fabric.componentLabels" (dict "root" . "component" "secrets-job") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hook) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $agent := $plan.agents }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $agent.name }}
  labels:
    {{- include "fabric.componentLabels" (dict "root" $ "component" "secrets-job") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hook) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $.Values.secretsJob.agentSecretName | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $agent.name }}
  labels:
    {{- include "fabric.componentLabels" (dict "root" $ "component" "secrets-job") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hook) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fabric.componentLabels" (dict "root" . "component" "secrets-job") | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hook) | nindent 4 }}
spec:
  backoffLimit: {{ .Values.secretsJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.secretsJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-secrets
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: secrets-job
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      # The only pod of this chart with an API token: it reads and creates
      # Secrets and does nothing else.
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        {{- include "fabric.restrictedPod" . | nindent 8 }}
      {{- with .Values.cliImagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fabric-secrets
          image: {{ include "fabric.cliImage" . | quote }}
          imagePullPolicy: {{ .Values.cliImage.pullPolicy }}
          args:
            {{- include "fabric.secretsArgs" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
          securityContext:
            {{- include "fabric.restrictedContainer" . | nindent 12 }}
          resources:
            {{- toYaml .Values.secretsJob.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
