{{- /*
Spec 058 §10.5: the host sensor DaemonSet, installed by the chart instead of a
hand-edited template (deploy/kubernetes/host-emitter-daemonset.yaml stays for
clusters that provision per-node directories themselves). The eBPF host
emitter in production mode: passive tracepoints, one source per node, each
with its own token and ingress group on the Node.

The only workload of this chart outside the restricted posture: root, hostPID
and four capabilities (never `privileged`), read-only host mounts of BTF,
cgroupfs, tracefs and debugfs, and its own state directory. Everything it
needs is generated by the secrets Job; nothing is copied onto a node.
*/ -}}
{{- if .Values.hostSensor.enabled }}
{{- $name := include "fabric.hostSensorName" . }}
{{- $nodes := include "fabric.hostSensorNodes" . | fromYamlArray }}
{{- $endpoints := include "fabric.hostSensorEndpoints" . | fromYaml }}
{{- $component := dict "root" . "component" "host-sensor" }}
{{- $collector := include "fabric.collectorValues" . | fromYaml }}
{{- $clientCert := dig "receiver" "requireClientCertificate" false $collector }}
{{- if not (.Values.tenant.id | toString | trim) }}
{{- fail "hostSensor.enabled=true needs tenant.id: every host record is bound to the Node's tenant (--set tenant.id=<your tenant>)" }}
{{- end }}
{{- if not (has (.Values.hostSensor.digests | toString) (list "omitted" "permitted")) }}
{{- fail "hostSensor.digests must be omitted or permitted" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fabric.componentLabels" $component | nindent 4 }}
# The token is projected into the emitter container only (below).
automountServiceAccountToken: false
---
# Read-only: the pods of the sensor's own node that match the selector (their
# uid, labels and RuntimeClass name; nothing read is exported), and the
# handler of a RuntimeClass by name. RBAC cannot limit a read to one node, so
# this token can read every pod object, inline env values included: keep
# secrets out of inline pod env (use Secret references).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "fabric-host-sensor-%s-%s" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "fabric.componentLabels" $component | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "fabric-host-sensor-%s-%s" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "fabric.componentLabels" $component | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "fabric-host-sensor-%s-%s" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Each node's ingress group on the Node (host:port), by group name. Not secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fabric.componentLabels" $component | nindent 4 }}
data:
  {{- toYaml $endpoints | nindent 2 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fabric.componentLabels" $component | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-host-emitter
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fabric-host-emitter
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: host-sensor
      annotations:
        # A node's port follows its position in the node list: when the list
        # changes, the sensors restart and read their endpoint again.
        checksum/nodes: {{ toJson $nodes | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostPID: true            # correlate kernel events to the host process tree
      hostNetwork: false
      {{- with .Values.hostSensor.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.hostSensor.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            # One term per node that has an ingress group and a Secret (a node
            # field selector takes one name). A node added to the cluster
            # later gets its sensor at the next `helm upgrade`.
            nodeSelectorTerms:
              {{- range $node := $nodes }}
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values: [{{ $node.name | quote }}]
              {{- end }}
      {{- with .Values.hostSensor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostSensor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: emitter
          image: {{ include "fabric.hostSensorImage" . | quote }}
          imagePullPolicy: {{ .Values.hostSensor.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EMIT_PRODUCTION
              value: "true"
            - name: EMIT_TENANT_ID
              value: {{ .Values.tenant.id | toString | quote }}
            # This sensor's source: s- + its label's pseudonym under the id key
            # (the secrets Job writes the same id into the node's Secret).
            - name: EMIT_SOURCE_LABEL
              value: "$(NODE_NAME)/ebpf"
            # The agents' FABRIC_HOST_LABEL on this node (the injector sets it).
            - name: EMIT_HOST_LABEL
              value: "$(NODE_NAME)"
            - name: EMIT_ID_KEY_FILE
              value: /var/run/secrets/fabric-id-key/id_key
            - name: EMIT_STATE_KEY_FILE
              value: /etc/fabric-host-emitter/state_key
            - name: EMIT_STATE_DIR
              value: /var/lib/fabric-host-emitter/state
            - name: EMIT_ENDPOINT_FILE
              value: /etc/fabric-host-emitter/endpoint
            - name: EMIT_BEARER_TOKEN_FILE
              value: /etc/fabric-host-emitter/token
            - name: EMIT_TLS_CA_FILE
              value: /var/run/secrets/fabric/ca.crt
            {{- if $clientCert }}
            - name: EMIT_TLS_CERT_FILE
              value: /var/run/secrets/fabric/tls.crt
            - name: EMIT_TLS_KEY_FILE
              value: /var/run/secrets/fabric/tls.key
            {{- end }}
            # Scope: the pod slice of every pod on this node that matches the
            # selector is an agent root. Never silently all-host.
            - name: EMIT_AGENT_POD_SELECTOR
              value: {{ .Values.hostSensor.agentPodSelector | toString | quote }}
            - name: EMIT_NODE_NAME
              value: "$(NODE_NAME)"
            - name: EMIT_ALL_HOST
              value: "false"
            - name: EMIT_EXEC
              value: {{ .Values.hostSensor.events.exec | toString | quote }}
            - name: EMIT_CONNECT
              value: {{ .Values.hostSensor.events.connect | toString | quote }}
            - name: EMIT_FILE_ACCESS
              value: {{ .Values.hostSensor.events.fileAccess | toString | quote }}
            - name: EMIT_MAX_EVENTS_PER_SEC
              value: "0"       # no intentional sampling of required events
            - name: EMIT_DEDUPE_WINDOW
              value: "0"       # production: every event keeps its own position
            - name: EMIT_DIGESTS
              value: {{ .Values.hostSensor.digests | toString | quote }}
            {{- range $key, $value := .Values.hostSensor.env }}
            {{- if not (hasPrefix "EMIT_" $key) }}
            {{- fail (printf "hostSensor.env takes EMIT_* variables only; %s is not one" $key) }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          securityContext:
            runAsUser: 0        # bpf() and tracefs access need root
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add:
                - BPF              # load tracepoint programs (kernel 5.8 or later)
                - PERFMON          # perf_event_open for tracepoint attach
                - SYS_RESOURCE     # RLIMIT_MEMLOCK
                - DAC_READ_SEARCH  # read /sys/kernel/btf and cgroupfs
          volumeMounts:
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: cgroupfs
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            # This node's files only: its token, state key and endpoint.
            - name: node-files
              mountPath: /etc/fabric-host-emitter
              subPathExpr: "$(NODE_NAME)"
              readOnly: true
            - name: state
              mountPath: /var/lib/fabric-host-emitter
            # subPath: the file itself (a Secret volume's entries are symlinks;
            # the id key must be a regular file of mode 0400 or 0440).
            - name: id-key
              mountPath: /var/run/secrets/fabric-id-key/id_key
              subPath: id_key
              readOnly: true
            - name: tls
              mountPath: /var/run/secrets/fabric
              readOnly: true
            # The pod watch's credential, at the in-cluster path.
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            {{- toYaml .Values.hostSensor.resources | nindent 12 }}
      volumes:
        - name: btf
          hostPath: { path: /sys/kernel/btf, type: Directory }
        - name: cgroupfs
          hostPath: { path: /sys/fs/cgroup, type: Directory }
        - name: tracefs
          hostPath: { path: /sys/kernel/tracing, type: Directory }
        - name: debugfs
          hostPath: { path: /sys/kernel/debug, type: Directory }
        - name: state
          hostPath: { path: {{ .Values.hostSensor.stateHostPath | quote }}, type: DirectoryOrCreate }
        # <node>/token, <node>/state_key and <node>/endpoint for every listed
        # node; the container mounts its own node's directory only.
        - name: node-files
          projected:
            defaultMode: 0400
            sources:
              {{- range $node := $nodes }}
              - secret:
                  name: {{ $node.secret }}
                  items:
                    - key: token
                      path: {{ printf "%s/token" $node.name | quote }}
                    - key: state-key
                      path: {{ printf "%s/state_key" $node.name | quote }}
              {{- end }}
              - configMap:
                  name: {{ $name }}
                  items:
                    {{- range $node := $nodes }}
                    - key: {{ printf "ebpf-%d.endpoint" (int $node.index) | quote }}
                      path: {{ printf "%s/endpoint" $node.name | quote }}
                    {{- end }}
        - name: id-key
          secret:
            secretName: {{ .Values.hostSensor.idKeySecretName }}
            defaultMode: 0400
            items:
              - key: id_key
                path: id_key
        - name: tls
          secret:
            secretName: {{ .Values.hostSensor.tlsSecretName }}
            defaultMode: 0400
        - name: api-access
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
