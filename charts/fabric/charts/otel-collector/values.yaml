# Default values for the Fabric OTel Collector subchart.
# See charts/fabric/charts/otel-collector/README.md for the rationale
# behind each block.

replicaCount: 1

image:
  repository: ghcr.io/singleaxis/fabric-otelcol
  tag: ""              # defaults to .Chart.AppVersion
  digest: ""           # production: sha256:...; when set, tag is ignored
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
enableServiceLinks: false
terminationGracePeriodSeconds: 60

# Distroless nonroot posture — the recorder runs unprivileged by default.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  # All three ports the collector listens on. Disable any you don't
  # terminate in your deployment to shrink the exposed surface.
  ports:
    otlpGrpc: 4317
    otlpHttp: 4318
    health: 13133

# OTLP ingress transport security. Supplying serverCertificateSecret.name
# enables TLS for both the gRPC and HTTP receivers. Supplying clientCASecret
# additionally makes both receivers verify client certificates (mTLS).
# Secret data is projected into the pod and referenced by file path; it is
# never copied into the Collector ConfigMap or Helm release values.
receiver:
  # Fail the render unless receiver TLS is configured. Regulated profiles
  # pin this on; the default remains false for local development clients.
  requireTLS: false
  # Fail the render unless TLS verifies client certificates against an
  # operator-provisioned CA. This implies requireTLS.
  requireClientCertificate: false
  tls:
    serverCertificateSecret:
      name: ""
      certKey: tls.crt
      keyKey: tls.key
    clientCASecret:
      name: ""
      key: ca.crt

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Liveness/readiness budgets sized for cold pulls of the multi-arch
# OTel Collector image (~40 MB) plus pipeline initialisation. The
# previous 5s readiness initial delay marked pods Unready repeatedly
# during rolling deploys on slow networks.
livenessProbe:
  httpGet:
    path: /
    port: health
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: health
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 3

# Gates liveness/readiness until the Collector has loaded its complete
# pipeline configuration. These probes report Collector process health;
# they deliberately do not claim that the remote telemetry backend is
# reachable. Queue/export failure metrics must be alerted separately.
startupProbe:
  httpGet:
    path: /
    port: health
  periodSeconds: 2
  failureThreshold: 30
  timeoutSeconds: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Fabric Node v1 has one protection mechanism: a deny-by-default export
# allowlist. It is always wired into both traces and logs. Policy enforcement,
# prompt-time PII processing, redaction sidecars, and sampling are not chart
# surfaces in the recorder release.
fabric:
  guard:
    eventClassAttribute: event_class
    dropUnknownClasses: true
    maxFieldBytes: 8192
    extraAllowedFields: {}
    # Optional exact metadata keys for traces. The processor rejects known
    # credential/content-shaped names; prefix wildcards are not supported.
    extraAllowedTraceFields: []

# OTLP/HTTP egress target.
#
# IMPORTANT: there is no production default destination. The operator chooses
# a customer-owned OTLP service, a private SingleAxis deployment, or an
# approved SingleAxis Platform endpoint.
#
# WHAT HAPPENS WHEN THIS IS EMPTY: the `otlp_http/fabric` exporter is
# not rendered at all, and the pipelines fall back to the `debug`
# exporter. Spans go to the collector pod's stdout and are readable
# with `kubectl logs`; NOTES.txt prints a loud post-install warning.
# Nothing is silently dropped, but stdout is NOT durable and is NOT an
# audit trail — it is a dev posture only. Set a real endpoint before
# you rely on any retention or compliance claim.
#
# Set this to the one approved OTLP/HTTP destination:
#
#   --set otel-collector.exporter.endpoint=https://otlp.<datadog>.com:443
#       (Datadog OTLP intake)
#
#   --set otel-collector.exporter.endpoint=http://api.honeycomb.io:443
#       (Honeycomb)
#
#   --set otel-collector.exporter.endpoint=http://your-collector:4318
#       (your own collector chain)
#
# Fabric recorder v1 does not install a backend or a second Relay hop. For
# fan-out, send to a customer-controlled Collector and configure its exporters.
exporter:
  endpoint: ""
  # Transport security. `insecure=true` is retained as the dev default
  # because a bare chart has no endpoint. Regulated profiles set false,
  # require an https:// endpoint, and reject insecureSkipVerify.
  insecure: true
  insecureSkipVerify: false
  requireTLS: false
  tls:
    # Secrets are created by the operator; Helm renders only file paths.
    caSecret:
      name: ""
      key: ca.crt
    clientCertificateSecret:
      name: ""
      certKey: tls.crt
      keyKey: tls.key
  auth:
    # Adds exactly one secret-backed HTTP header to OTLP/HTTP requests.
    # The secret value is injected into the pod environment and is never
    # copied into values, the rendered ConfigMap, or Helm release data.
    headerName: Authorization
    secret:
      name: ""
      key: authorization
  requireAuth: false
  # Fail the render when `endpoint` is empty instead of falling back to
  # the debug exporter. Default false, so a bare install works and is
  # loudly warned about. shadow-production sets this true because pod
  # stdout is not an audit trail and production must name its destination.
  requireEndpoint: false

  # Exporter helper resilience. An in-memory queue survives short backend
  # failures but not pod/node loss. Persistence switches the workload to a
  # StatefulSet and creates one retained PVC per replica, unless an existing
  # claim is selected (existing claims are restricted to one replica).
  sendingQueue:
    enabled: true
    numConsumers: 10
    queueSize: 1000
    blockOnOverflow: false
    persistence:
      enabled: false
      directory: /var/lib/otelcol-fabric/storage
      fsync: false
      existingClaim: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      storageClass: ""
      annotations: {}
  retry:
    enabled: true
    initialInterval: 5s
    maxInterval: 30s
    maxElapsedTime: 5m
  timeout: 30s

  # Compliance profiles use this render-time invariant rather than relying
  # on a convention spread across several independent values.
  requireDurableQueue: false

# Also write to the debug exporter? Useful in dev, noisy in prod.
# NOTE: the debug exporter is added automatically whenever
# `exporter.endpoint` is empty, regardless of this flag — that is the
# no-silent-drop fallback. This flag adds it ALONGSIDE a configured
# OTLP endpoint.
debugExporter:
  enabled: false
  verbosity: basic

memoryLimiter:
  checkIntervalSeconds: 1
  limitMib: 512

batch:
  # Development throughput optimization. Disable whenever the durable queue
  # contract is required so acknowledged OTLP is handed directly to the
  # persistent exporter queue instead of waiting in volatile batch memory.
  enabled: true
  timeoutSeconds: 5
  sendBatchSize: 512

# PodDisruptionBudget. Default enabled so the audit-trail span
# stream isn't dropped during node drains. Honored only when
# replicaCount > 1.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# NetworkPolicy. Default off because not every CNI enforces them and
# misconfigured policies will silently break the OTLP path.
# shadow-production enables it alongside namespace deny-default.
#
# `ingressFrom` is appended verbatim to the OTLP ingress rule. An empty
# LIST means "any namespace in the cluster" (rendered as an explicit
# namespaceSelector fallback); tenants typically narrow to specific agent
# namespaces:
#
#   ingressFrom:
#     - namespaceSelector:
#         matchLabels:
#           fabric.singleaxis.ai/agent: "true"
#
# Every peer entry in ingressFrom, exporterEgress.to, and egressTo must
# name an explicit restriction: empty peers ({}) and world CIDRs
# (ipBlock 0.0.0.0/0 or ::/0) are rejected at render time because they are
# equivalent to no policy.
#
# `egressTo` is for the configured exporter endpoint plus any extra
# destinations the operator declares (e.g. an external OTLP gateway,
# Tempo, Honeycomb, or a non-kube-system DNS service). DNS to kube-system
# is always allowed.
networkPolicy:
  enabled: false
  # When true, rendering fails unless ingressFrom names at least one peer.
  # Production enables this so a successful install cannot silently expose
  # the OTLP receiver to every namespace in the cluster.
  requireExplicitIngress: false
  ingressFrom: []
  # Exporter egress is distinct from additional destinations so regulated
  # profiles can prove that an operator deliberately named both a peer and
  # its ports. The chart cannot infer a CIDR or namespace from an arbitrary
  # exporter URL.
  exporterEgress:
    requireExplicit: false
    to: []
    ports: []
  # Additional non-exporter peers. This compatibility surface remains for
  # DNS-independent internal services and operator extensions. The same
  # non-empty, non-world peer rule applies.
  egressTo: []
  # Optional LabelSelector for the monitoring namespace allowed to reach
  # the health extension. Empty (default) renders no health ingress rule:
  # kubelet liveness/readiness probes are node traffic and do not need a
  # NetworkPolicy from-rule on most CNIs. An empty selector
  # ({matchLabels: {}}) is rejected because it matches every namespace.
  #
  #   monitoringNamespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: monitoring
  monitoringNamespaceSelector: {}
