{{- include "otel-collector.validateReceiver" . -}}
{{- include "otel-collector.validateExporter" . -}}
{{- include "otel-collector.validateDelivery" . -}}
{{- include "otel-collector.validateNetworkPolicy" . -}}
{{- $exporters := include "otel-collector.exporterNames" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.fullname" . }}-config
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.service.ports.otlpGrpc }}
            {{- if .Values.receiver.evidenceSourceBinding.enabled }}
            auth:
              authenticator: bearertokenauth/evidence_source
            {{- else if .Values.receiver.workloadAuthentication.enabled }}
            auth:
              authenticator: bearertokenauth/workload
            {{- end }}
            # Bound per-request work: metadata-only records are small, so
            # 8 MiB is generous headroom that also bounds the worst-case
            # queued item.
            max_recv_msg_size_mib: 8
            max_concurrent_streams: 64
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: false
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            tls:
              cert_file: /etc/fabric/receiver-tls/tls.crt
              key_file: /etc/fabric/receiver-tls/tls.key
              {{- if .Values.receiver.tls.clientCASecret.name }}
              client_ca_file: /etc/fabric/receiver-tls/client-ca.crt
              {{- end }}
            {{- end }}
          http:
            endpoint: 0.0.0.0:{{ .Values.service.ports.otlpHttp }}
            {{- if .Values.receiver.evidenceSourceBinding.enabled }}
            auth:
              authenticator: bearertokenauth/evidence_source
            {{- else if .Values.receiver.workloadAuthentication.enabled }}
            auth:
              authenticator: bearertokenauth/workload
            {{- end }}
            # Zero-value timeouts let a client hold a connection open
            # mid-headers indefinitely; auth runs after the read.
            read_header_timeout: 5s
            read_timeout: 30s
            idle_timeout: 120s
            max_request_body_size: 8388608 # 8 MiB
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            tls:
              cert_file: /etc/fabric/receiver-tls/tls.crt
              key_file: /etc/fabric/receiver-tls/tls.key
              {{- if .Values.receiver.tls.clientCASecret.name }}
              client_ca_file: /etc/fabric/receiver-tls/client-ca.crt
              {{- end }}
            {{- end }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.service.ports.health }}
      {{- if .Values.receiver.evidenceSourceBinding.enabled }}
      bearertokenauth/evidence_source:
        filename: /etc/fabric/evidence-source/token
        require_single_token: true
      {{- end }}
      {{- if .Values.receiver.workloadAuthentication.enabled }}
      bearertokenauth/workload:
        filename: /etc/fabric/workload-auth/token
        require_single_token: true
      {{- end }}
      {{- if .Values.exporter.sendingQueue.persistence.enabled }}
      file_storage/fabric:
        directory: {{ .Values.exporter.sendingQueue.persistence.directory | quote }}
        timeout: 1s
        create_directory: true
        fsync: {{ .Values.exporter.sendingQueue.persistence.fsync }}
      {{- end }}

    processors:
      memory_limiter:
        check_interval: {{ .Values.memoryLimiter.checkIntervalSeconds }}s
        limit_mib: {{ .Values.memoryLimiter.limitMib }}
      fabricguard:
        event_class_attribute: {{ .Values.fabric.guard.eventClassAttribute | quote }}
        drop_unknown_classes: {{ .Values.fabric.guard.dropUnknownClasses }}
        max_field_bytes: {{ .Values.fabric.guard.maxFieldBytes }}
        {{- if .Values.receiver.evidenceSourceBinding.enabled }}
        evidence_source_binding:
          tenant_id: {{ .Values.receiver.evidenceSourceBinding.tenantId | quote }}
          source_id: {{ .Values.receiver.evidenceSourceBinding.sourceId | quote }}
        {{- end }}
        {{- with .Values.fabric.guard.extraAllowedFields }}
        extra_allowed_fields:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.fabric.guard.extraAllowedTraceFields }}
        extra_allowed_trace_fields:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if .Values.batch.enabled }}
      batch:
        timeout: {{ .Values.batch.timeoutSeconds }}s
        send_batch_size: {{ .Values.batch.sendBatchSize }}
      {{- end }}

    exporters:
      {{- if .Values.exporter.endpoint }}
      otlp_http/fabric:
        endpoint: {{ .Values.exporter.endpoint | quote }}
        timeout: {{ .Values.exporter.timeout | quote }}
        {{- if .Values.exporter.auth.secret.name }}
        headers:
          {{ .Values.exporter.auth.headerName | quote }}: "${env:FABRIC_EXPORT_AUTH}"
        {{- end }}
        tls:
          insecure: {{ .Values.exporter.insecure }}
          insecure_skip_verify: {{ .Values.exporter.insecureSkipVerify }}
          {{- if .Values.exporter.tls.caSecret.name }}
          ca_file: /etc/fabric/exporter-tls/ca.crt
          {{- end }}
          {{- if .Values.exporter.tls.clientCertificateSecret.name }}
          cert_file: /etc/fabric/exporter-tls/tls.crt
          key_file: /etc/fabric/exporter-tls/tls.key
          {{- end }}
        sending_queue:
          enabled: {{ .Values.exporter.sendingQueue.enabled }}
          {{- if .Values.exporter.sendingQueue.enabled }}
          num_consumers: {{ .Values.exporter.sendingQueue.numConsumers }}
          queue_size: {{ .Values.exporter.sendingQueue.queueSize }}
          block_on_overflow: {{ .Values.exporter.sendingQueue.blockOnOverflow }}
          {{- if .Values.exporter.sendingQueue.persistence.enabled }}
          storage: file_storage/fabric
          {{- end }}
          {{- end }}
        retry_on_failure:
          enabled: {{ .Values.exporter.retry.enabled }}
          {{- if .Values.exporter.retry.enabled }}
          initial_interval: {{ .Values.exporter.retry.initialInterval | quote }}
          max_interval: {{ .Values.exporter.retry.maxInterval | quote }}
          max_elapsed_time: {{ .Values.exporter.retry.maxElapsedTime | quote }}
          {{- end }}
      {{- end }}
      {{- if or .Values.debugExporter.enabled (not .Values.exporter.endpoint) }}
      debug:
        verbosity: {{ .Values.debugExporter.verbosity }}
      {{- end }}

    service:
      extensions:
        - health_check
        {{- if .Values.receiver.evidenceSourceBinding.enabled }}
        - bearertokenauth/evidence_source
        {{- end }}
        {{- if .Values.receiver.workloadAuthentication.enabled }}
        - bearertokenauth/workload
        {{- end }}
        {{- if .Values.exporter.sendingQueue.persistence.enabled }}
        - file_storage/fabric
        {{- end }}
      telemetry:
        logs:
          level: info
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, fabricguard{{ if .Values.batch.enabled }}, batch{{ end }}]
          exporters: [{{ $exporters }}]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, fabricguard{{ if .Values.batch.enabled }}, batch{{ end }}]
          exporters: [{{ $exporters }}]
