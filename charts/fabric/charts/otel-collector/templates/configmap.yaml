{{- include "otel-collector.validateReceiver" . -}}
{{- include "otel-collector.validateExporter" . -}}
{{- include "otel-collector.validateDelivery" . -}}
{{- include "otel-collector.validateContent" . -}}
{{- include "otel-collector.validateProfile" . -}}
{{- include "otel-collector.validateNetworkPolicy" . -}}
{{- $content := .Values.content -}}
{{- $persist := .Values.exporter.sendingQueue.persistence -}}
{{- $exporters := include "otel-collector.exporterNames" . -}}
{{- $production := eq .Values.fabric.profile "production" -}}
{{- $workload := .Values.receiver.workloadAuthentication -}}
{{- $sealed := and $content.enabled $persist.enabled $content.encryption.keySecret.name -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel-collector.fullname" . }}-config
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.service.ports.otlpGrpc }}
            {{- if .Values.receiver.evidenceSourceBinding.enabled }}
            auth:
              authenticator: bearertokenauth/evidence_source
            {{- else if .Values.receiver.workloadAuthentication.enabled }}
            auth:
              authenticator: bearertokenauth/workload
            {{- end }}
            # Bound per-request work: metadata-only records are small, so
            # 8 MiB is generous headroom that also bounds the worst-case
            # queued item.
            max_recv_msg_size_mib: 8
            max_concurrent_streams: 64
            keepalive:
              enforcement_policy:
                min_time: 10s
                permit_without_stream: false
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            tls:
              cert_file: /etc/fabric/receiver-tls/tls.crt
              key_file: /etc/fabric/receiver-tls/tls.key
              {{- if .Values.receiver.tls.clientCASecret.name }}
              client_ca_file: /etc/fabric/receiver-tls/client-ca.crt
              {{- end }}
            {{- end }}
          http:
            endpoint: 0.0.0.0:{{ .Values.service.ports.otlpHttp }}
            {{- if .Values.receiver.evidenceSourceBinding.enabled }}
            auth:
              authenticator: bearertokenauth/evidence_source
            {{- else if .Values.receiver.workloadAuthentication.enabled }}
            auth:
              authenticator: bearertokenauth/workload
            {{- end }}
            # Zero-value timeouts let a client hold a connection open
            # mid-headers indefinitely; auth runs after the read.
            read_header_timeout: 5s
            read_timeout: 30s
            idle_timeout: 120s
            max_request_body_size: 8388608 # 8 MiB
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            tls:
              cert_file: /etc/fabric/receiver-tls/tls.crt
              key_file: /etc/fabric/receiver-tls/tls.key
              {{- if .Values.receiver.tls.clientCASecret.name }}
              client_ca_file: /etc/fabric/receiver-tls/client-ca.crt
              {{- end }}
            {{- end }}
      {{- if $content.enabled }}
      # Content ingress (spec 048): HTTP only, same TLS/mTLS (and workload
      # bearer token, when enabled) as telemetry,
      # sized for one 64 MiB body per request. Never part of a telemetry
      # pipeline; fabric-gate refuses any other routing.
      otlp/content:
        protocols:
          http:
            endpoint: 0.0.0.0:{{ .Values.service.ports.otlpContent }}
            {{- if .Values.receiver.workloadAuthentication.enabled }}
            # The content port holds the same workload credential as 4317/4318
            # (fabric-gate refuses a content receiver without the telemetry
            # receivers' authenticator).
            auth:
              authenticator: bearertokenauth/workload
            {{- end }}
            read_header_timeout: 5s
            read_timeout: 120s
            idle_timeout: 120s
            max_request_body_size: {{ int64 $content.maxRequestBodyBytes }}
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            tls:
              cert_file: /etc/fabric/receiver-tls/tls.crt
              key_file: /etc/fabric/receiver-tls/tls.key
              {{- if .Values.receiver.tls.clientCASecret.name }}
              client_ca_file: /etc/fabric/receiver-tls/client-ca.crt
              {{- end }}
            {{- end }}
      {{- end }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.service.ports.health }}
      {{- if .Values.receiver.evidenceSourceBinding.enabled }}
      bearertokenauth/evidence_source:
        filename: /etc/fabric/evidence-source/token
        require_single_token: true
      {{- end }}
      {{- if .Values.receiver.workloadAuthentication.enabled }}
      bearertokenauth/workload:
        filename: /etc/fabric/workload-auth/token
        require_single_token: true
      {{- end }}
      {{- if .Values.exporter.endpoint }}
      # Spec 048 H1: refuse HTTP redirects on the OTLP/HTTP exporter. Any 3xx
      # from the destination is a retryable failure; the batch and its
      # Authorization header are never re-sent to another location.
      # fabric-gate refuses an otlp_http exporter without this middleware.
      noredirect: {}
      {{- end }}
      {{- if .Values.exporter.sendingQueue.persistence.enabled }}
      file_storage/fabric:
        directory: {{ .Values.exporter.sendingQueue.persistence.directory | quote }}
        timeout: 1s
        create_directory: true
        fsync: {{ .Values.exporter.sendingQueue.persistence.fsync }}
      {{- if $content.enabled }}
      {{- if $sealed }}
      # Spec 049 §7.8: everything the content queue persists is sealed with
      # the Node-side customer key (content.encryption.keySecret, mounted as a
      # file); delivery semantics are unchanged.
      fabricenvelope/fabric_content:
        storage: file_storage/fabric_content
        key_file: /etc/fabric/content-key/key
      {{- end }}
      file_storage/fabric_content:
        directory: {{ printf "%s/content-queue" $persist.directory | quote }}
        timeout: 1s
        create_directory: true
        # Queued records are raw model bytes: created private. An existing
        # directory and its database are tightened by fabriccontent at start
        # (queue_directory below); file_storage never tightens them.
        directory_permissions: "0700"
        fsync: {{ $persist.fsync }}
      {{- end }}
      {{- end }}

    processors:
      memory_limiter:
        check_interval: {{ .Values.memoryLimiter.checkIntervalSeconds }}s
        limit_mib: {{ include "otel-collector.memoryLimitMiB" . }}
      fabricguard:
        event_class_attribute: {{ .Values.fabric.guard.eventClassAttribute | quote }}
        drop_unknown_classes: {{ .Values.fabric.guard.dropUnknownClasses }}
        max_field_bytes: {{ .Values.fabric.guard.maxFieldBytes }}
        profile: {{ .Values.fabric.profile | quote }}
        {{- if .Values.receiver.evidenceSourceBinding.enabled }}
        evidence_source_binding:
          tenant_id: {{ .Values.receiver.evidenceSourceBinding.tenantId | quote }}
          source_id: {{ .Values.receiver.evidenceSourceBinding.sourceId | quote }}
        {{- else if and $production $workload.enabled }}
        # Spec 049 §7.9: every batch on the workload ingress is bound to its
        # tenant and source; spans admitted here are stamped
        # fabric.source.authenticated=true.
        evidence_source_binding:
          tenant_id: {{ $workload.tenantId | quote }}
          source_id: {{ $workload.sourceId | quote }}
        {{- end }}
        capture_labels: {{ .Values.fabric.guard.captureLabels | default "pseudonymous" | quote }}
        identity_mode: {{ .Values.fabric.guard.identityMode | default "pseudonymous" | quote }}
        {{- with .Values.fabric.guard.extraAllowedFields }}
        extra_allowed_fields:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.fabric.guard.extraAllowedTraceFields }}
        extra_allowed_trace_fields:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.fabric.guard.captureModelAllowlist }}
        capture_model_allowlist:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if .Values.batch.enabled }}
      batch:
        timeout: {{ .Values.batch.timeoutSeconds }}s
        send_batch_size: {{ .Values.batch.sendBatchSize }}
      {{- end }}

    exporters:
      {{- if .Values.exporter.endpoint }}
      otlp_http/fabric:
        endpoint: {{ .Values.exporter.endpoint | quote }}
        timeout: {{ .Values.exporter.timeout | quote }}
        middlewares:
          - id: noredirect
        {{- if .Values.exporter.auth.secret.name }}
        headers:
          {{ .Values.exporter.auth.headerName | quote }}: "${env:FABRIC_EXPORT_AUTH}"
        {{- end }}
        tls:
          insecure: {{ .Values.exporter.insecure }}
          insecure_skip_verify: {{ .Values.exporter.insecureSkipVerify }}
          {{- if .Values.exporter.tls.caSecret.name }}
          ca_file: /etc/fabric/exporter-tls/ca.crt
          {{- end }}
          {{- if .Values.exporter.tls.clientCertificateSecret.name }}
          cert_file: /etc/fabric/exporter-tls/tls.crt
          key_file: /etc/fabric/exporter-tls/tls.key
          {{- end }}
        sending_queue:
          enabled: {{ .Values.exporter.sendingQueue.enabled }}
          {{- if .Values.exporter.sendingQueue.enabled }}
          num_consumers: {{ .Values.exporter.sendingQueue.numConsumers }}
          queue_size: {{ .Values.exporter.sendingQueue.queueSize }}
          block_on_overflow: {{ .Values.exporter.sendingQueue.blockOnOverflow }}
          {{- if .Values.exporter.sendingQueue.persistence.enabled }}
          storage: file_storage/fabric
          {{- end }}
          {{- end }}
        retry_on_failure:
          enabled: {{ .Values.exporter.retry.enabled }}
          {{- if .Values.exporter.retry.enabled }}
          initial_interval: {{ .Values.exporter.retry.initialInterval | quote }}
          max_interval: {{ .Values.exporter.retry.maxInterval | quote }}
          max_elapsed_time: {{ .Values.exporter.retry.maxElapsedTime | quote }}
          {{- end }}
      {{- end }}
      {{- if $content.enabled }}
      fabriccontent:
        profile: {{ .Values.fabric.profile | quote }}
        {{- if and $production $workload.enabled }}
        source_binding:
          tenant_id: {{ $workload.tenantId | quote }}
          source_id: {{ $workload.sourceId | quote }}
        {{- end }}
        allowed_tenants:
          {{- range $content.allowedTenants }}
          - {{ . | quote }}
          {{- end }}
        {{- if $content.allowMultipleTenants }}
        allow_multiple_tenants: true
        {{- end }}
        backend: {{ $content.backend | quote }}
        {{- if eq $content.backend "file" }}
        file:
          directory: {{ include "otel-collector.contentFileDirectory" . | quote }}
          {{- if $content.encryption.keySecret.name }}
          # Spec 049 §7.8: objects and descriptors in the customer-key envelope.
          encryption_key_file: /etc/fabric/content-key/key
          {{- end }}
        {{- else }}
        s3:
          bucket: {{ $content.s3.bucket | quote }}
          prefix: {{ $content.s3.prefix | quote }}
          {{- with $content.s3.region }}
          region: {{ . | quote }}
          {{- end }}
          {{- with $content.s3.endpoint }}
          endpoint: {{ . | quote }}
          {{- end }}
          use_path_style: {{ $content.s3.usePathStyle }}
          sse: {{ $content.s3.sse | quote }}
          {{- with $content.s3.kmsKeyId }}
          kms_key_id: {{ . | quote }}
          {{- end }}
        {{- end }}
        timeout: {{ $content.timeout | quote }}
        {{- if $persist.enabled }}
        queue_directory: {{ printf "%s/content-queue" $persist.directory | quote }}
        {{- end }}
        sending_queue:
          enabled: true
          num_consumers: {{ $content.queue.numConsumers }}
          queue_size: {{ $content.queue.queueSize }}
          block_on_overflow: true
          {{- if $sealed }}
          storage: fabricenvelope/fabric_content
          {{- else if $persist.enabled }}
          storage: file_storage/fabric_content
          {{- end }}
        retry_on_failure:
          enabled: true
          initial_interval: {{ $content.retry.initialInterval | quote }}
          max_interval: {{ $content.retry.maxInterval | quote }}
          # Never give up on content: it is retried until the store accepts it.
          max_elapsed_time: "0s"
      {{- end }}
      {{- if or .Values.debugExporter.enabled (not .Values.exporter.endpoint) }}
      debug:
        verbosity: {{ .Values.debugExporter.verbosity }}
      {{- end }}

    service:
      extensions:
        - health_check
        {{- if .Values.receiver.evidenceSourceBinding.enabled }}
        - bearertokenauth/evidence_source
        {{- end }}
        {{- if .Values.receiver.workloadAuthentication.enabled }}
        - bearertokenauth/workload
        {{- end }}
        {{- if .Values.exporter.endpoint }}
        - noredirect
        {{- end }}
        {{- if .Values.exporter.sendingQueue.persistence.enabled }}
        - file_storage/fabric
        {{- if $content.enabled }}
        - file_storage/fabric_content
        {{- if $sealed }}
        - fabricenvelope/fabric_content
        {{- end }}
        {{- end }}
        {{- end }}
      telemetry:
        logs:
          level: info
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, fabricguard{{ if .Values.batch.enabled }}, batch{{ end }}]
          exporters: [{{ $exporters }}]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, fabricguard{{ if .Values.batch.enabled }}, batch{{ end }}]
          exporters: [{{ $exporters }}]
        {{- if $content.enabled }}
        # Content bodies bypass fabricguard (they must pass unchanged); the
        # fabriccontent exporter enforces the closed descriptor itself.
        logs/content:
          receivers: [otlp/content]
          processors: [memory_limiter]
          exporters: [fabriccontent]
        {{- end }}
