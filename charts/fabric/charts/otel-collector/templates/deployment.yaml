{{- $contentFileVolume := include "otel-collector.contentFileVolume" . -}}
{{- $contentS3Creds := and .Values.content.enabled (eq .Values.content.backend "s3") .Values.content.s3.credentialsSecret.name -}}
{{- $contentS3CA := and .Values.content.enabled (eq .Values.content.backend "s3") .Values.content.s3.caSecret.name -}}
{{- $groups := include "otel-collector.groupMode" . -}}
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" .Values.exporter.sendingQueue.persistence.enabled }}
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  {{- if .Values.exporter.sendingQueue.persistence.enabled }}
  serviceName: {{ include "otel-collector.fullname" . }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- else }}
  strategy:
    type: RollingUpdate
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otel-collector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Force a pod roll when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.receiver.workloadAuthentication.enabled }}
        fabric.singleaxis.ai/tenant-id: {{ .Values.receiver.workloadAuthentication.tenantId | quote }}
        fabric.singleaxis.ai/workload-id: {{ .Values.receiver.workloadAuthentication.workloadId | quote }}
        fabric.singleaxis.ai/identity-attestation-ref: {{ .Values.receiver.workloadAuthentication.identityAttestationRef | quote }}
        {{- if .Values.receiver.workloadAuthentication.policyDigest }}
        fabric.singleaxis.ai/capture-policy-version: {{ .Values.receiver.workloadAuthentication.policyVersion | quote }}
        fabric.singleaxis.ai/capture-policy-digest: {{ .Values.receiver.workloadAuthentication.policyDigest | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.exporter.sendingQueue.persistence.encryptionAttestationRef }}
        fabric.singleaxis.ai/storage-encryption-attestation-ref: {{ .Values.exporter.sendingQueue.persistence.encryptionAttestationRef | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "otel-collector.serviceAccountName" . }}
      # Never mount an API token, including when serviceAccount.create=false
      # selects the namespace default ServiceAccount.
      automountServiceAccountToken: false
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: otel-collector
          image: {{ include "otel-collector.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/otelcol-fabric/config.yaml
          ports:
            {{- if $groups }}
            {{- include "otel-collector.groupPorts" (dict "groups" .Values.receiver.sourceBindings "key" "containerPort") | nindent 12 }}
            {{- else }}
            - name: otlp-grpc
              containerPort: {{ .Values.service.ports.otlpGrpc }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.service.ports.otlpHttp }}
              protocol: TCP
            {{- if .Values.content.enabled }}
            - name: otlp-content
              containerPort: {{ .Values.service.ports.otlpContent }}
              protocol: TCP
            {{- end }}
            {{- end }}
            - name: health
              containerPort: {{ .Values.service.ports.health }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-fabric
              readOnly: true
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            - name: receiver-tls
              mountPath: /etc/fabric/receiver-tls
              readOnly: true
            {{- end }}
            {{- if .Values.receiver.evidenceSourceBinding.enabled }}
            - name: evidence-source-token
              mountPath: /etc/fabric/evidence-source
              readOnly: true
            {{- end }}
            {{- if .Values.receiver.workloadAuthentication.enabled }}
            - name: workload-auth-token
              mountPath: /etc/fabric/workload-auth
              readOnly: true
            {{- end }}
            {{- range $i, $g := .Values.receiver.sourceBindings }}
            # Group {{ $g.name }}'s token (spec 053 §6.1): its receivers only.
            - name: ingress-token-{{ $i }}
              mountPath: /etc/fabric/ingress/{{ $g.name }}
              readOnly: true
            {{- end }}
            {{- if and .Values.content.enabled .Values.content.encryption.keySecret.name }}
            - name: content-key
              mountPath: /etc/fabric/content-key
              readOnly: true
            {{- end }}
            {{- if include "otel-collector.mappingEnabled" . }}
            {{- if .Values.fabric.mapping.profileConfigMap.name }}
            # Spec 057 §4.5: the customer's mapping profile (the image has none).
            - name: mapping-profile
              mountPath: /etc/fabric/mapping
              readOnly: true
            {{- end }}
            {{- if .Values.fabric.mapping.idKeySecret.name }}
            - name: mapping-id-key
              mountPath: /etc/fabric/mapping-id-key
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.exporter.sendingQueue.persistence.enabled }}
            - name: queue-storage
              mountPath: {{ .Values.exporter.sendingQueue.persistence.directory }}
            {{- end }}
            {{- if or .Values.exporter.tls.caSecret.name .Values.exporter.tls.clientCertificateSecret.name }}
            - name: exporter-tls
              mountPath: /etc/fabric/exporter-tls
              readOnly: true
            {{- end }}
            {{- if eq $contentFileVolume "emptyDir" }}
            # Development only: no queue PVC, so the file content backend
            # lives on an emptyDir and is lost with the pod.
            - name: content-store
              mountPath: {{ .Values.exporter.sendingQueue.persistence.directory }}
            {{- end }}
            {{- if $contentS3CA }}
            - name: content-s3-ca
              mountPath: /etc/fabric/content-s3-ca
              readOnly: true
            {{- end }}
          {{- if or .Values.exporter.auth.secret.name $contentS3Creds $contentS3CA }}
          env:
            {{- if .Values.exporter.auth.secret.name }}
            - name: FABRIC_EXPORT_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exporter.auth.secret.name }}
                  key: {{ .Values.exporter.auth.secret.key }}
            {{- end }}
            {{- if $contentS3Creds }}
            # Static keys for an S3-compatible content store, read by the
            # default AWS credential chain. Never rendered into values or the
            # ConfigMap; on AWS prefer IRSA via serviceAccount.annotations.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.content.s3.credentialsSecret.name }}
                  key: {{ .Values.content.s3.credentialsSecret.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.content.s3.credentialsSecret.name }}
                  key: {{ .Values.content.s3.credentialsSecret.secretAccessKeyKey }}
            {{- end }}
            {{- if $contentS3CA }}
            # The content store's private CA (content.s3.caSecret). Only the
            # S3 client reads AWS_CA_BUNDLE; the exporter keeps its own trust.
            - name: AWS_CA_BUNDLE
              value: /etc/fabric/content-s3-ca/ca.crt
            {{- end }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "otel-collector.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        {{- if .Values.receiver.tls.serverCertificateSecret.name }}
        - name: receiver-tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.receiver.tls.serverCertificateSecret.name }}
                  items:
                    - key: {{ .Values.receiver.tls.serverCertificateSecret.certKey }}
                      path: tls.crt
                    - key: {{ .Values.receiver.tls.serverCertificateSecret.keyKey }}
                      path: tls.key
              {{- if .Values.receiver.tls.clientCASecret.name }}
              - secret:
                  name: {{ .Values.receiver.tls.clientCASecret.name }}
                  items:
                    - key: {{ .Values.receiver.tls.clientCASecret.key }}
                      path: client-ca.crt
              {{- end }}
        {{- end }}
        {{- if .Values.receiver.evidenceSourceBinding.enabled }}
        - name: evidence-source-token
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.receiver.evidenceSourceBinding.tokenSecret.name | quote }}
                  items:
                    - key: {{ .Values.receiver.evidenceSourceBinding.tokenSecret.key | quote }}
                      path: token
        {{- end }}
        {{- if .Values.receiver.workloadAuthentication.enabled }}
        - name: workload-auth-token
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.receiver.workloadAuthentication.tokenSecret.name | quote }}
                  items:
                    - key: {{ .Values.receiver.workloadAuthentication.tokenSecret.key | quote }}
                      path: token
        {{- end }}
        {{- range $i, $g := .Values.receiver.sourceBindings }}
        - name: ingress-token-{{ $i }}
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ $g.tokenSecret.name | quote }}
                  items:
                    - key: {{ $g.tokenSecret.key | quote }}
                      path: token
        {{- end }}
        {{- if and .Values.content.enabled .Values.content.encryption.keySecret.name }}
        # Spec 049 §7.8: the Node-side content key, a file (never env or values).
        - name: content-key
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.content.encryption.keySecret.name | quote }}
                  items:
                    - key: {{ .Values.content.encryption.keySecret.key | quote }}
                      path: key
        {{- end }}
        {{- if include "otel-collector.mappingEnabled" . }}
        {{- if .Values.fabric.mapping.profileConfigMap.name }}
        - name: mapping-profile
          configMap:
            name: {{ .Values.fabric.mapping.profileConfigMap.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.fabric.mapping.profileConfigMap.key | quote }}
                path: profile.json
        {{- end }}
        {{- if .Values.fabric.mapping.idKeySecret.name }}
        # The agents' id key, a file of mode 0440 (never env or values).
        - name: mapping-id-key
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.fabric.mapping.idKeySecret.name | quote }}
                  items:
                    - key: {{ .Values.fabric.mapping.idKeySecret.key | quote }}
                      path: key
        {{- end }}
        {{- end }}
        {{- if and .Values.exporter.sendingQueue.persistence.enabled .Values.exporter.sendingQueue.persistence.existingClaim }}
        - name: queue-storage
          persistentVolumeClaim:
            claimName: {{ .Values.exporter.sendingQueue.persistence.existingClaim }}
        {{- end }}
        {{- if eq $contentFileVolume "emptyDir" }}
        - name: content-store
          emptyDir: {}
        {{- end }}
        {{- if $contentS3CA }}
        - name: content-s3-ca
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: {{ .Values.content.s3.caSecret.name | quote }}
                  items:
                    - key: {{ .Values.content.s3.caSecret.key | quote }}
                      path: ca.crt
        {{- end }}
        {{- if or .Values.exporter.tls.caSecret.name .Values.exporter.tls.clientCertificateSecret.name }}
        - name: exporter-tls
          projected:
            defaultMode: 0440
            sources:
              {{- if .Values.exporter.tls.caSecret.name }}
              - secret:
                  name: {{ .Values.exporter.tls.caSecret.name }}
                  items:
                    - key: {{ .Values.exporter.tls.caSecret.key }}
                      path: ca.crt
              {{- end }}
              {{- if .Values.exporter.tls.clientCertificateSecret.name }}
              - secret:
                  name: {{ .Values.exporter.tls.clientCertificateSecret.name }}
                  items:
                    - key: {{ .Values.exporter.tls.clientCertificateSecret.certKey }}
                      path: tls.crt
                    - key: {{ .Values.exporter.tls.clientCertificateSecret.keyKey }}
                      path: tls.key
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.exporter.sendingQueue.persistence.enabled (not .Values.exporter.sendingQueue.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: queue-storage
        labels:
          {{- include "otel-collector.labels" . | nindent 10 }}
        {{- with .Values.exporter.sendingQueue.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.exporter.sendingQueue.persistence.accessModes | nindent 10 }}
        {{- if .Values.exporter.sendingQueue.persistence.storageClass }}
        storageClassName: {{ .Values.exporter.sendingQueue.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.exporter.sendingQueue.persistence.size }}
  {{- end }}
