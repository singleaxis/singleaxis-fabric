apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" .Values.exporter.sendingQueue.persistence.enabled }}
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  {{- if .Values.exporter.sendingQueue.persistence.enabled }}
  serviceName: {{ include "otel-collector.fullname" . }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- else }}
  strategy:
    type: RollingUpdate
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otel-collector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Force a pod roll when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "otel-collector.serviceAccountName" . }}
      # Never mount an API token, including when serviceAccount.create=false
      # selects the namespace default ServiceAccount.
      automountServiceAccountToken: false
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: otel-collector
          image: {{ include "otel-collector.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/otelcol-fabric/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.service.ports.otlpGrpc }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.service.ports.otlpHttp }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.ports.health }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-fabric
              readOnly: true
            {{- if .Values.receiver.tls.serverCertificateSecret.name }}
            - name: receiver-tls
              mountPath: /etc/fabric/receiver-tls
              readOnly: true
            {{- end }}
            {{- if .Values.exporter.sendingQueue.persistence.enabled }}
            - name: queue-storage
              mountPath: {{ .Values.exporter.sendingQueue.persistence.directory }}
            {{- end }}
            {{- if or .Values.exporter.tls.caSecret.name .Values.exporter.tls.clientCertificateSecret.name }}
            - name: exporter-tls
              mountPath: /etc/fabric/exporter-tls
              readOnly: true
            {{- end }}
          {{- if .Values.exporter.auth.secret.name }}
          env:
            - name: FABRIC_EXPORT_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.exporter.auth.secret.name }}
                  key: {{ .Values.exporter.auth.secret.key }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "otel-collector.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        {{- if .Values.receiver.tls.serverCertificateSecret.name }}
        - name: receiver-tls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.receiver.tls.serverCertificateSecret.name }}
                  items:
                    - key: {{ .Values.receiver.tls.serverCertificateSecret.certKey }}
                      path: tls.crt
                    - key: {{ .Values.receiver.tls.serverCertificateSecret.keyKey }}
                      path: tls.key
              {{- if .Values.receiver.tls.clientCASecret.name }}
              - secret:
                  name: {{ .Values.receiver.tls.clientCASecret.name }}
                  items:
                    - key: {{ .Values.receiver.tls.clientCASecret.key }}
                      path: client-ca.crt
              {{- end }}
        {{- end }}
        {{- if and .Values.exporter.sendingQueue.persistence.enabled .Values.exporter.sendingQueue.persistence.existingClaim }}
        - name: queue-storage
          persistentVolumeClaim:
            claimName: {{ .Values.exporter.sendingQueue.persistence.existingClaim }}
        {{- end }}
        {{- if or .Values.exporter.tls.caSecret.name .Values.exporter.tls.clientCertificateSecret.name }}
        - name: exporter-tls
          projected:
            defaultMode: 0440
            sources:
              {{- if .Values.exporter.tls.caSecret.name }}
              - secret:
                  name: {{ .Values.exporter.tls.caSecret.name }}
                  items:
                    - key: {{ .Values.exporter.tls.caSecret.key }}
                      path: ca.crt
              {{- end }}
              {{- if .Values.exporter.tls.clientCertificateSecret.name }}
              - secret:
                  name: {{ .Values.exporter.tls.clientCertificateSecret.name }}
                  items:
                    - key: {{ .Values.exporter.tls.clientCertificateSecret.certKey }}
                      path: tls.crt
                    - key: {{ .Values.exporter.tls.clientCertificateSecret.keyKey }}
                      path: tls.key
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.exporter.sendingQueue.persistence.enabled (not .Values.exporter.sendingQueue.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: queue-storage
        labels:
          {{- include "otel-collector.labels" . | nindent 10 }}
        {{- with .Values.exporter.sendingQueue.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.exporter.sendingQueue.persistence.accessModes | nindent 10 }}
        {{- if .Values.exporter.sendingQueue.persistence.storageClass }}
        storageClassName: {{ .Values.exporter.sendingQueue.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.exporter.sendingQueue.persistence.size }}
  {{- end }}
