# LOCAL TRIAL ONLY. This profile is plaintext, unauthenticated, and uses
# pod stdout when no destination is supplied. Never use it across a trust
# boundary or claim it provides durable audit retention.
profile:
  name: shadow-dev

# Helm stores the release in the release namespace before it creates any
# object, so that namespace exists first: install with --create-namespace.
# namespace.create=true renders a Namespace object for a pipeline that
# applies rendered manifests itself (helm template, GitOps); `helm install`
# cannot adopt a namespace that already exists.
namespace:
  create: false
  name: fabric-system

networkPolicy:
  denyDefault: false

otelCollector:
  enabled: true

otel-collector:
  replicaCount: 1
  receiver:
    requireTLS: false
    requireClientCertificate: false
  fabric:
    guard:
      dropUnknownClasses: true
  exporter:
    endpoint: ""
    requireEndpoint: false
    requireTLS: false
    requireAuth: false
    requireDurableQueue: false
  debugExporter:
    enabled: true
    verbosity: basic
  networkPolicy:
    enabled: false
