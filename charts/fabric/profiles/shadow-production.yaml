# Production passive-shadow posture. This profile does not block, transform,
# or delay the monitored AI system. It protects the exported record with the
# deny-by-default Fabric allowlist and delivers through a persistent queue.
#
# The operator must supply:
#   tenant.id
#   otel-collector.exporter.endpoint (https://)
#   the referenced ingress TLS, client CA, and export-auth Secrets
#   at least one ingressFrom peer identifying the monitored workload
#   exporterEgress.to and exporterEgress.ports matching that destination
#   an approved full sha256 Collector image digest (tags are insufficient)
#   workloadAuthentication tenant/workload identity, token Secret and review ref
#   a suitable encrypted StorageClass (or existing customer-owned PVC), plus
#   encryptionAttestationRef naming the independent storage/KMS review
#
# Content delivery (spec 048) is off until the operator enables it with:
#   otel-collector.content.enabled=true
#   otel-collector.content.allowedTenants[0]=<FABRIC_TENANT_ID of the agents>
#   otel-collector.content.backend=s3, content.s3.bucket, content.s3.sse
#     (aws:kms + kmsKeyId, or AES256) -- the file backend is refused here
#   the Node writer role via otel-collector.serviceAccount.annotations (IRSA)
#   networkPolicy.contentEgress.to/ports for the store (and STS for IRSA)
# Agents then reach 4319 with the same client certificate as 4317/4318.
#
# Delivery is at least once. A successful OTLP acknowledgement proves remote
# acceptance, not durable persistence by an arbitrary destination.
profile:
  name: shadow-production

namespace:
  create: true
  name: fabric-system

networkPolicy:
  denyDefault: true

otelCollector:
  enabled: true

otel-collector:
  replicaCount: 2
  # No fabricated production digest. Select and verify the approved release:
  #   --set otel-collector.image.digest=sha256:<64-lowercase-hex>
  # A version-shaped tag remains mutable and is never sufficient.
  image:
    tag: ""
    digest: ""
    pullPolicy: Always
  receiver:
    requireTLS: true
    requireClientCertificate: true
    workloadAuthentication:
      enabled: true
      # Supply tenantId equal to tenant.id, and the single approved workload.
      tenantId: ""
      workloadId: ""
      identityAttestationRef: ""
      tokenSecret:
        name: ""
        key: token
    tls:
      serverCertificateSecret:
        name: fabric-node-receiver-tls
        certKey: tls.crt
        keyKey: tls.key
      clientCASecret:
        name: fabric-node-client-ca
        key: ca.crt
  fabric:
    guard:
      dropUnknownClasses: true
  exporter:
    requireEndpoint: true
    requireTLS: true
    requireAuth: true
    requireDurableQueue: true
    insecure: false
    insecureSkipVerify: false
    auth:
      headerName: Authorization
      secret:
        name: fabric-node-export-auth
        key: authorization
    sendingQueue:
      enabled: true
      numConsumers: 10
      queueSize: 10000
      blockOnOverflow: true
      persistence:
        enabled: true
        directory: /var/lib/otelcol-fabric/storage
        fsync: true
        size: 20Gi
    retry:
      enabled: true
      initialInterval: 5s
      maxInterval: 30s
      maxElapsedTime: 0s
  content:
    enabled: false
    requireServerSideEncryption: true
  debugExporter:
    enabled: false
  batch:
    enabled: false
    timeoutSeconds: 5
    sendBatchSize: 512
  networkPolicy:
    enabled: true
    requireExplicitIngress: true
    ingressFrom: []
    exporterEgress:
      requireExplicit: true
      to: []
      ports: []
