apiVersion: v2
name: fabric
description: |
  SingleAxis Fabric Node — customer-controlled passive recorder for
  observable AI activity. Capture, protect, and deliver without changing
  or delaying the monitored system.
type: application
version: 0.8.0-rc.1
appVersion: "0.8.0-rc.1"
kubeVersion: ">=1.29.0-0"
keywords:
  - ai-observability
  - observability
  - opentelemetry
  - audit
home: https://github.com/singleaxis/singleaxis-fabric
sources:
  - https://github.com/singleaxis/singleaxis-fabric
maintainers:
  - name: SingleAxis
    url: https://singleaxis.com
icon: ""
annotations:
  category: Compliance
  licenses: Apache-2.0

# Fabric Node v1 packages exactly one runtime: the Fabric Collector. The
# vendored otel-collector subchart is the only dependency.
dependencies:
  - name: otel-collector
    version: 0.4.0
    condition: otelCollector.enabled
    # Vendored dependency: the subchart source ships under charts/ and is the
    # only released dependency. Do NOT run `helm dependency update` — an empty
    # repository must not be resolved or replaced by a remote chart.
    repository: ""
    tags:
      - telemetry
